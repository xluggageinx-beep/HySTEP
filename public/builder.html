<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EZ-STEP 견적 요청</title>
<style>:root{--n:#12335f;--b:#2a6fdb;--l:#dbe3ef;--m:#667085;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#172033}.top{height:68px;background:white;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand img{display:block;width:176px;height:auto}.top a{color:var(--n);font-weight:700;text-decoration:none}.wrap{max-width:1000px;margin:32px auto;padding:0 18px}.steps{display:flex;gap:8px;margin-bottom:18px}.step{flex:1;height:6px;border-radius:9px;background:#dce3ed}.step.on{background:var(--b)}.card{background:white;border:1px solid var(--l);border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:0 7px 22px rgba(18,51,95,.05)}h1{margin:0 0 8px;color:var(--n);font-size:28px}h2{font-size:18px;color:var(--n)}.muted{color:var(--m);line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:11px;border:1px solid var(--l);border-radius:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grades,.features{display:flex;gap:8px;flex-wrap:wrap}.toggle{border:1px solid var(--l);background:white;border-radius:9px;padding:9px 13px;font-weight:700}.toggle.on{background:#eaf3ff;border-color:var(--b);color:var(--b)}.section{border:1px solid var(--l);border-radius:12px;margin-bottom:9px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:14px}.items{padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap}.section.off .items{opacity:.35;pointer-events:none}.item{font-size:13px;border:1px solid var(--l);background:#fff;border-radius:8px;padding:8px 10px}.item.on{border-color:#9dbde9;background:#f3f8ff;color:#245aa7}.actions{display:flex;justify-content:space-between;margin-top:18px}.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:750;text-decoration:none;display:inline-block}.primary{background:var(--b);color:white}.ghost{background:white;border:1px solid var(--l)}.summary-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:11px 0}.success{text-align:center;padding:50px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{padding:0 14px}.card{padding:18px}h1{font-size:24px}}</style></head>
<body><header class="top"><div class="brand"><img src="/images/ez-step-blue.png" alt="EZ-STEP"></div><a href="/">홈으로</a></header><main class="wrap"><div class="steps" id="steps"></div><div id="app"></div></main>
<script src="/prototype-store.js"></script><script>
const canonical=PrototypeStore.getDefaultSections();
let step=1;const state={schoolName:'',applicationYear:'',grades:[],studentCount:'',participantCount:'',sections:canonical,features:{photo:true,professor:true,inlineAi:true},contact:{name:'',email:'',phone:''}};
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){document.getElementById('steps').innerHTML=[1,2,3,4].map(i=>`<span class="step ${i<=step?'on':''}"></span>`).join('');if(step===1)basic();if(step===2)chart();if(step===3)features();if(step===4)summary()}
function nav(){return`<div class="actions"><button class="btn ghost" onclick="back()">${step===1?'홈으로':'이전'}</button>${step<4?'<button class="btn primary" onclick="next()">다음</button>':''}</div>`}
function basic(){app.innerHTML=`<div class="card"><h1>학교 도입 기본정보</h1><p class="muted">도입 상담과 견적 검토에 필요한 학교 규모를 입력합니다.</p><div class="grid"><div><label>학교명</label><input id="schoolName" value="${esc(state.schoolName)}"></div><div><label>차트 적용 연도</label><input id="applicationYear" type="number" value="${state.applicationYear}"></div><div><label>총 학생 수</label><input id="studentCount" type="number" min="1" value="${state.studentCount}"></div><div><label>총 예상 대상자 수 (대략)</label><input id="participantCount" type="number" min="1" value="${state.participantCount}"></div></div><h2>적용 학년</h2><div class="grades">${['1학년','2학년','3학년','4학년'].map(g=>`<button class="toggle ${state.grades.includes(g)?'on':''}" onclick="grade('${g}')">${g}</button>`).join('')}</div></div><div class="card"><h2>학교별 운영</h2><p class="muted">학생 그룹, 그룹별 담당 교수, 필요 시 추가 교수 구성을 지원합니다. 실제 명단과 교수 배정은 도입 후 학교 설정에서 구성합니다.</p></div>${nav()}`}
function syncBasic(){['schoolName','applicationYear','studentCount','participantCount'].forEach(k=>{const e=document.getElementById(k);if(e)state[k]=e.type==='number'?(e.value===''?'':Number(e.value)):e.value.trim()})}function grade(g){syncBasic();state.grades=state.grades.includes(g)?state.grades.filter(x=>x!==g):[...state.grades,g].sort();render()}
function chart(){app.innerHTML=`<div class="card"><h1>차트 구조</h1><p class="muted">정확히 8개 Section과 하위 항목을 선택합니다.</p>${state.sections.map((s,i)=>`<div class="section ${s.enabled?'':'off'}"><div class="section-head"><b>${i+1}. ${s.name}</b><button class="toggle ${s.enabled?'on':''}" onclick="toggleSection('${s.sectionId}')">${s.enabled?'ON':'OFF'}</button></div><div class="items">${s.items.map(x=>`<button class="item ${x.enabled?'on':''}" onclick="toggleItem('${s.sectionId}','${x.itemId}')">${x.enabled?'✓ ':''}${x.name}</button>`).join('')}</div></div>`).join('')}</div>${nav()}`}
function syncGoalDependency(){const plan=state.sections.find(x=>x.sectionId==='s5'),goal=state.sections.find(x=>x.sectionId==='s8')?.items.find(x=>x.itemId==='s8-goal');if(!goal)return;const available=Boolean(plan?.enabled&&plan.items.some(i=>i.enabled));if(!available&&!goal.dependencyLocked){goal.previousEnabled=goal.enabled;goal.enabled=false;goal.dependencyLocked=true}else if(available&&goal.dependencyLocked){goal.enabled=goal.previousEnabled!==false;delete goal.previousEnabled;delete goal.dependencyLocked}}
function toggleSection(id){const s=state.sections.find(x=>x.sectionId===id);s.enabled=!s.enabled;syncGoalDependency();render()}function toggleItem(sid,iid){const s=state.sections.find(x=>x.sectionId===sid);if(!s.enabled)return;const i=s.items.find(x=>x.itemId===iid);if(i.dependencyLocked)return;i.enabled=!i.enabled;syncGoalDependency();render()}
function features(){app.innerHTML=`<div class="card"><h1>사용할 기능</h1><p class="muted">학교에서 사용할 Hy-STEP 기능을 선택합니다.</p><div class="features">${[['photo','포토'],['professor','교수 피드백 및 서명'],['inlineAi','AI 어시스턴트']].map(([k,n])=>`<button class="toggle ${state.features[k]?'on':''}" onclick="state.features['${k}']=!state.features['${k}'];render()">${n}</button>`).join('')}</div><p class="muted">선택 결과는 담당자 검토 후 학교별 설정에 반영됩니다.</p></div>${nav()}`}
function summary(){const enabled=state.sections.filter(s=>s.enabled);app.innerHTML=`<div class="card"><h1>견적 요청</h1><p class="muted">선택한 구성을 바탕으로 담당자가 확인합니다.</p>${[['학교명',state.schoolName],['차트 적용 연도',state.applicationYear+'년'],['적용 학년',state.grades.join(', ')],['총 학생 수',state.studentCount+'명'],['총 예상 대상자 수',state.participantCount+'명'],['Section',enabled.length+'개']].map(x=>`<div class="summary-row"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}</div><div class="card"><h2>신청자 정보</h2><div class="grid"><div><label>이름</label><input id="contactName" value="${esc(state.contact.name)}"></div><div><label>이메일</label><input id="contactEmail" type="email" value="${esc(state.contact.email)}"></div><div><label>연락처</label><input id="contactPhone" value="${esc(state.contact.phone)}"></div></div></div><div class="actions"><button class="btn ghost" onclick="back()">이전</button><button class="btn primary" onclick="submitQuote()">견적 요청하기</button></div>`}
function next(){if(step===1){syncBasic();if(!state.schoolName||!state.applicationYear||!state.studentCount||!state.participantCount||!state.grades.length)return alert('필수 기본정보를 입력하세요.')}step++;render()}function back(){if(step===1)location.href='/';else{step--;render()}}
function submitQuote(){state.contact={name:document.getElementById('contactName').value.trim(),email:document.getElementById('contactEmail').value.trim(),phone:document.getElementById('contactPhone').value.trim()};if(!state.contact.name||!state.contact.email)return alert('이름과 이메일을 입력하세요.');const quote=PrototypeStore.saveQuote({...state,sections:state.sections.map(s=>({...s,items:s.items.map(i=>({...i}))}))});app.innerHTML=`<div class="card success"><h1>견적 요청이 접수되었습니다.</h1><p>견적 번호 <b>${quote.quoteId}</b></p><p class="muted">담당자가 구성을 확인해 도입 상담과 견적을 안내합니다.</p><a class="btn primary" href="/">홈으로</a></div>`}
render();
</script></body></html>
