<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자스텝</title>
<style>:root{--n:#102a56;--b:#1976d2;--l:#dbe3ef;--m:#667085;--bg:#f5f7fb;--g:#16815d}*{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:var(--bg)}button,input,textarea,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#102a56,#0c2348);color:white;padding:24px 16px}.brand{font-size:20px;font-weight:900;margin-bottom:28px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dbe8fa;padding:11px;text-align:left;border-radius:9px;font-weight:650}.nav button.on{background:#ffffff18;color:white}.main{padding:28px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.head h1{margin:0;color:var(--n)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(16,42,86,.04)}.kpi b{font-size:28px;display:block;color:var(--n)}.muted{color:var(--m)}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--b);color:white}.ghost{background:white;border:1px solid var(--l)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--l);font-size:13px}tbody tr{cursor:pointer}tbody tr:hover{background:#f7faff}.status{font-size:12px;padding:4px 8px;border-radius:99px;background:#eef2f7}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap}.detail{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid var(--l);border-radius:8px;padding:9px}.section-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--l);padding:10px 0}.hidden{display:none}.search{max-width:260px}.actions{display:flex;gap:8px;flex-wrap:wrap}.lifecycle{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:4px 0 18px}.life{position:relative;padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--m);background:#f8fafc;border-top:1px solid var(--l);border-bottom:1px solid var(--l)}.life:first-child{border-left:1px solid var(--l);border-radius:10px 0 0 10px}.life:last-child{border-right:1px solid var(--l);border-radius:0 10px 10px 0}.life.on{background:#edf5ff;color:#1556a6}.life:not(:last-child):after{content:"›";position:absolute;right:-4px;color:#98a2b3}.config-section{border:1px solid var(--l);border-radius:11px;padding:12px;margin-bottom:9px}.config-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.config-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.config-items .btn{font-size:12px;padding:7px 9px}.off{opacity:.55}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.lifecycle{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid,.detail{grid-template-columns:1fr}.main{padding:15px}.nav{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.lifecycle{grid-template-columns:1fr}.life{border:1px solid var(--l)!important;border-radius:8px!important}.section-row{align-items:flex-start;flex-direction:column;gap:4px}}</style>
</head><body><div class="app"><aside class="side"><div class="brand">관리자스텝</div><nav class="nav" id="nav"></nav></aside><main class="main"><div id="view"></div></main></div>
<script src="/admin-access-config.js"></script><script src="/admin-auth-guard.js"></script><script src="/prototype-store.js"></script><script>
let page='dashboard',selectedQuote=null,selectedSchool=null,schoolTab='basic',query='';const view=document.getElementById('view'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pages=[['dashboard','대시보드'],['quotes','견적 관리'],['schools','학교 관리'],['contracts','계약'],['settings','설정']];
function renderNav(){document.getElementById('nav').innerHTML=pages.map(([k,n])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}function go(p){page=p;selectedQuote=null;selectedSchool=null;render()}
function render(){renderNav();if(page==='dashboard')dashboard();if(page==='quotes')quotes();if(page==='schools')schools();if(page==='contracts')contracts();if(page==='settings')settings()}
function header(title,sub,actions=''){return`<div class="head"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions">${actions}</div></div>`}
function lifecycle(active=0){return`<div class="lifecycle">${['견적 접수','학교 생성','서비스 구성','차트 구성','운영 설정','활성 상태'].map((n,i)=>`<div class="life ${i<=active?'on':''}">${n}</div>`).join('')}</div>`}
function dashboard(){const s=PrototypeStore.getState(),newQ=s.quotes.filter(q=>q.status==='new').length,active=s.schools.filter(x=>x.status==='active').length;view.innerHTML=header('관리자 대시보드','견적에서 학교 운영까지 한 흐름으로 관리합니다.',`<button class="btn ghost" onclick="location.href='/hystep-preview'">Hy-STEP 열기</button>`)+lifecycle(5)+`<div class="grid"><div class="card kpi"><span class="muted">신규 견적</span><b>${newQ}</b></div><div class="card kpi"><span class="muted">운영 학교</span><b>${active}</b></div><div class="card kpi"><span class="muted">전체 계약</span><b>${s.schools.length}</b></div><div class="card kpi"><span class="muted">최근 활동</span><b>${s.activities.length}</b></div></div><div class="card"><h2>최근 활동</h2>${s.activities.slice(0,8).map(a=>`<div class="section-row"><span>${esc(a.type)}</span><span class="muted">${new Date(a.createdAt).toLocaleString('ko-KR')}</span></div>`).join('')||'<p class="muted">활동 없음</p>'}</div>`}
function quotes(){if(selectedQuote)return quoteDetail();const list=PrototypeStore.getQuotes().filter(q=>!query||q.schoolName.includes(query)||q.quoteId.includes(query));view.innerHTML=header('견적 관리','EZ-STEP에서 제출한 견적과 동일한 데이터',`<input class="search" placeholder="학교명·견적번호 검색" oninput="query=this.value;quotes()">`)+`<div class="card"><table><thead><tr><th>견적번호</th><th>학교명</th><th>연도</th><th>학생/대상자</th><th>상태</th></tr></thead><tbody>${list.map(q=>`<tr onclick="selectedQuote='${q.quoteId}';quotes()"><td>${q.quoteId}</td><td><b>${esc(q.schoolName)}</b></td><td>${q.applicationYear}</td><td>${q.studentCount} / ${q.participantCount}</td><td><span class="status">${q.status==='new'?'미처리':'처리완료'}</span></td></tr>`).join('')}</tbody></table></div>`}
function quoteDetail(){const q=PrototypeStore.getQuote(selectedQuote);view.innerHTML=header(q.schoolName,'견적 상세 · 학교 생성 전 검토',`<button class="btn ghost" onclick="selectedQuote=null;quotes()">목록</button><button class="btn primary" onclick="createSchool('${q.quoteId}')">학교 생성</button>`)+lifecycle(q.status==='done'?1:0)+`<div class="detail"><div class="card"><h2>도입 정보</h2>${[['차트 적용 연도',q.applicationYear],['적용 학년',(q.grades||[]).join(', ')],['예상 학생 수',q.studentCount],['예상 대상자 수',q.participantCount]].map(x=>`<div class="section-row"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}<h2>차트 Section</h2>${q.sections.map(s=>`<div class="section-row"><span>${s.name}</span><span>${s.enabled?'사용':'미사용'} · ${(s.items||[]).filter(i=>i.enabled).map(i=>i.name).join(', ')||'활성 Form 없음'}</span></div>`).join('')}</div><div class="card"><h2>신청자</h2><div class="section-row"><span>이름</span><b>${esc(q.contact.name)}</b></div><div class="section-row"><span>이메일</span><b>${esc(q.contact.email)}</b></div><div class="section-row"><span>연락처</span><b>${esc(q.contact.phone||'-')}</b></div><label>내부 메모</label><textarea id="quoteMemo">${esc(q.memo||'')}</textarea><button class="btn primary" onclick="saveQuoteMemo('${q.quoteId}')">메모 저장</button></div></div>`}
function saveQuoteMemo(id){PrototypeStore.updateQuote(id,{memo:document.getElementById('quoteMemo').value});alert('저장했습니다.')}function createSchool(id){const s=PrototypeStore.createSchoolFromQuote(id);selectedQuote=null;page='schools';selectedSchool=s.schoolId;render()}
function schools(){if(selectedSchool)return schoolDetail();const list=PrototypeStore.getSchools();view.innerHTML=header('학교 관리','학교별 Hy-STEP 설정과 운영 상태')+`<div class="card"><table><thead><tr><th>학교명</th><th>상태</th><th>적용 연도</th><th>적용 학년</th><th>예상 학생</th><th>예상 대상자</th></tr></thead><tbody>${list.map(s=>`<tr onclick="selectedSchool='${s.schoolId}';schools()"><td><b>${esc(s.name)}</b></td><td>${s.status}</td><td>${s.applicationYear}</td><td>${esc((s.grades||[]).join(', ')||'-')}</td><td>${s.studentCount}</td><td>${s.participantCount}</td></tr>`).join('')}</tbody></table></div>`}
function schoolDetail(){const s=PrototypeStore.getSchool(selectedSchool),tabs=[['basic','기본정보'],['service','서비스 구성'],['chart','차트 구성'],['permission','권한/노출'],['operations','운영 설정'],['roster','학생 명단'],['memo','메모/이력']];view.innerHTML=header(s.name,`${s.status==='active'?'운영 중':'설정 준비 중'} · ${s.applicationYear}년 · ${(s.grades||[]).join(', ')||'학년 미지정'}`,`<button class="btn ghost" onclick="selectedSchool=null;schools()">목록</button><button class="btn primary" onclick="openSchoolPreview()">Hy-STEP Preview 열기</button><button class="btn ghost" onclick="saveSchool()">저장</button>`)+lifecycle(s.status==='active'?5:3)+`<div class="tabs">${tabs.map(([k,n])=>`<button class="btn tab ${schoolTab===k?'primary':'ghost'}" onclick="schoolTab='${k}';schoolDetail()">${n}</button>`).join('')}</div><div id="schoolBody"></div>`;const body=document.getElementById('schoolBody');if(schoolTab==='basic')body.innerHTML=`<div class="card detail"><div><label>학교명</label><input id="schoolName" value="${esc(s.name)}"></div><div><label>차트 적용 연도</label><input id="schoolYear" type="number" value="${s.applicationYear}"></div><div class="section-row"><span>적용 학년</span><b>${esc((s.grades||[]).join(', ')||'-')}</b></div><div class="section-row"><span>예상 학생 수</span><b>${s.studentCount}명</b></div><div class="section-row"><span>예상 대상자 수</span><b>${s.participantCount}명</b></div><div class="section-row"><span>Preview demo 학생</span><b>${PrototypeStore.getStudents(s.schoolId).length}명</b></div></div>`;if(schoolTab==='service'){const labels={photo:'포토',professor:'교수 피드백 및 서명',inlineAi:'AI 어시스턴트'};body.innerHTML=`<div class="card">${Object.entries(labels).map(([k,n])=>`<div class="section-row"><span>${n}</span><button class="btn ${s.features?.[k]?'primary':'ghost'}" onclick="toggleSchoolFeature('${k}')">${s.features?.[k]?'사용':'미사용'}</button></div>`).join('')}</div>`}if(schoolTab==='chart')body.innerHTML=`<div class="card">${s.sections.map(x=>`<div class="config-section ${x.enabled?'':'off'}"><div class="config-head"><b>${x.name}</b><button class="btn ${x.enabled?'primary':'ghost'}" onclick="toggleSchoolSection('${x.sectionId}')">${x.enabled?'ON':'OFF'}</button></div><div class="config-items">${(x.items||[]).map(i=>`<button class="btn ${i.enabled?'primary':'ghost'}" ${x.enabled?'':'disabled'} onclick="toggleSchoolForm('${x.sectionId}','${i.itemId}')">${i.enabled?'✓ ':''}${i.name}</button>`).join('')}</div></div>`).join('')}</div>`;if(schoolTab==='permission')body.innerHTML='<div class="card"><p>학생과 교수는 동일 차트를 사용하며 역할에 따라 작성·교수 평가 권한이 달라집니다.</p></div>';if(schoolTab==='operations')body.innerHTML='<div class="card"><p>학생 그룹 · 그룹별 기본 담당 교수 · 필요 시 추가 교수 배정을 구성합니다.</p></div>';if(schoolTab==='roster')roster(body,s);if(schoolTab==='memo')body.innerHTML=`<div class="card"><label>운영 메모</label><textarea id="schoolNotes">${esc(s.notes||'')}</textarea><p class="muted">학교 설정 변경 사항을 기록합니다.</p></div>`}
function roster(body,s){const students=PrototypeStore.getStudents(s.schoolId),groups=PrototypeStore.getGroups(s.schoolId),professors=PrototypeStore.getProfessors(s.schoolId);body.innerHTML=`<div class="card"><div class="head"><div><h2>Preview demo 학생 ${students.length}명</h2><p class="muted">계약 예상 학생 ${s.studentCount}명과 별개인 검토용 예시 명단입니다.</p></div><button class="btn ghost" disabled>Excel 가져오기 shell</button></div><table><thead><tr><th>이름</th><th>학번</th><th>학년</th><th>그룹</th><th>기본 담당 교수</th><th>추가 교수</th></tr></thead><tbody>${students.map(st=>{const g=groups.find(x=>x.groupId===st.groupId),primary=professors.find(x=>x.professorId===g?.primaryProfessorId);return`<tr><td>${st.name}</td><td>${st.studentNo}</td><td>${st.grade}</td><td>${g?.name||'-'}</td><td>${primary?.name||'-'}</td><td>${(g?.additionalProfessorIds||[]).map(id=>professors.find(p=>p.professorId===id)?.name).filter(Boolean).join(', ')||'-'}</td></tr>`}).join('')}</tbody></table></div>`}
function openSchoolPreview(){PrototypeStore.setCurrentSchool(selectedSchool);location.href=`/hystep-preview?schoolId=${encodeURIComponent(selectedSchool)}`}
function toggleSchoolFeature(key){const s=PrototypeStore.getSchool(selectedSchool);s.features={...(s.features||{}),[key]:!s.features?.[key]};if(key==='professor')s.permissions={...(s.permissions||{}),professor:s.features[key]};PrototypeStore.saveSchool(s);schoolDetail()}
function toggleSchoolSection(sectionId){const s=PrototypeStore.getSchool(selectedSchool),section=s.sections.find(x=>x.sectionId===sectionId);section.enabled=!section.enabled;PrototypeStore.saveSchool(s);schoolDetail()}
function toggleSchoolForm(sectionId,itemId){const s=PrototypeStore.getSchool(selectedSchool),section=s.sections.find(x=>x.sectionId===sectionId);if(!section.enabled)return;const item=section.items.find(x=>x.itemId===itemId);item.enabled=!item.enabled;PrototypeStore.saveSchool(s);schoolDetail()}
function saveSchool(){const s=PrototypeStore.getSchool(selectedSchool);if(schoolTab==='basic')Object.assign(s,{name:document.getElementById('schoolName').value,applicationYear:Number(document.getElementById('schoolYear').value)});if(schoolTab==='memo')s.notes=document.getElementById('schoolNotes').value;PrototypeStore.saveSchool(s);alert('학교 설정을 저장했습니다.')}
function contracts(){view.innerHTML=header('계약','학교별 계약 및 활성 상태')+`<div class="card">${PrototypeStore.getSchools().map(s=>`<div class="section-row"><b>${esc(s.name)}</b><span>${s.contractStatus}</span></div>`).join('')}</div>`}function settings(){view.innerHTML=header('설정','관리자스텝 운영 설정',`<button class="btn ghost" onclick="AdminAccess.logout();location.reload()">로그아웃</button>`)+`<div class="card"><h2>운영 기본값</h2><p class="muted">학교 생성과 운영에 사용하는 기본 설정을 관리합니다.</p></div>`}
PrototypeStore.subscribe(()=>render());render();
</script></body></html>
