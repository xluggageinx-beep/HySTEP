<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hy-STEP 역할 기반 Preview</title>
<style>
:root{--navy:#102a56;--blue:#1976d2;--pale:#eff6ff;--line:#dbe3ef;--ink:#172033;--muted:#667085;--green:#16815d;--red:#c94040;--amber:#9a6500}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,Arial,sans-serif;color:var(--ink);background:#f6f8fc}button,input,textarea{font:inherit}button{cursor:pointer}
.top{min-height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 24px;position:sticky;top:0;z-index:20}
.brand{font-weight:900;color:var(--navy);white-space:nowrap}.brand span{color:var(--blue)}.editable{border:0;border-bottom:1px dashed #aab7c8;background:transparent;padding:3px 5px;font-weight:800;max-width:260px}.term{font-size:12px;color:var(--muted)}
.shell{max-width:1420px;margin:auto;padding:24px 20px}.hero{text-align:center;padding:52px 20px}.hero h1{font-size:36px;margin:0 0 12px}.hero p,.muted{color:var(--muted)}
.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,360px));justify-content:center;gap:18px;margin-top:28px}.role{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:left;box-shadow:0 12px 30px #102a5610}.role:hover{border-color:var(--blue)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:white}.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:var(--red)}.active-toggle{background:#e6f4ee;color:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.kpi{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.kpi b{font-size:27px;display:block}
.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.panel-body{padding:17px}
.student-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.student-card{aspect-ratio:3/4;background:white;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;flex-direction:column;min-height:390px;box-shadow:0 6px 18px #102a5609}
.student-card.dragging{opacity:.45}.student-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.student-head b{font-size:17px}.drag{color:#98a2b3;cursor:grab}.participant-list{display:grid;gap:8px;margin-top:12px;overflow:auto}
.participant-row{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;text-align:left;width:100%}.participant-row.selected{border-color:var(--blue);background:var(--pale)}.participant-row.pdf-selected{outline:2px solid #7c3aed;background:#f5f3ff}
.row-top{display:flex;justify-content:space-between;gap:5px}.dates{font-size:10px;color:var(--muted);margin-top:3px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.chip{font-size:9px;padding:3px 6px;border-radius:99px;background:#eef2f7}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:7px}.count{font-size:8px;text-align:center;padding:3px 1px;border-radius:5px;background:#f2f4f7}.count strong{display:block;font-size:11px}
.grid{display:grid;grid-template-columns:310px 1fr;gap:18px}.list{display:grid;gap:9px}.person{border:1px solid var(--line);border-radius:12px;padding:12px;background:white;text-align:left}.person.active{border-color:var(--blue);background:var(--pale)}
.section-tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.section-tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 10px}.section-tab.active{background:var(--navy);color:white}
.chart-card{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}.chart-card h3{margin:0 0 10px}.status{font-size:12px;font-weight:800;padding:5px 9px;border-radius:99px;background:#eef2f7}.status.wait{background:#fff3d8;color:var(--amber)}.status.signed{background:#dcf7eb;color:var(--green)}
textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:11px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.comment{background:var(--pale);border-radius:10px;padding:11px;margin-top:10px}.evaluation,.ai-rec{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}.ai-rec{border-color:#c4b5fd;background:#faf8ff}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.warning{background:#fff7e8;color:#8b5b00;border:1px solid #f1d49a;padding:10px;border-radius:9px;margin-top:10px}
.review-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}.floating-ai{position:fixed;right:20px;bottom:20px;width:330px;z-index:30;background:white;border:1px solid #c4b5fd;border-radius:16px;box-shadow:0 20px 50px #102a5630;overflow:hidden}.ai-head{background:#5b43b5;color:white;padding:12px;display:flex;justify-content:space-between}.ai-body{padding:12px}.ai-message{background:#f4f1ff;border-radius:10px;padding:9px;font-size:12px;margin-bottom:8px}.hidden{display:none!important}
@media(max-width:1180px){.student-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){.student-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:600px){.role-grid,.two,.student-grid{grid-template-columns:1fr}.student-card{aspect-ratio:3/4;min-height:0}.kpis{grid-template-columns:1fr}.top{padding:9px 12px}.hero h1{font-size:28px}.floating-ai{left:12px;right:12px;width:auto}.editable{max-width:150px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Hy-<span>STEP</span> Preview</div><div id="courseDisplay"></div><div class="toolbar" id="topActions"></div></header>
<main class="shell" id="app"></main>
<div class="floating-ai hidden" id="studentAi"><div class="ai-head"><b>학생 개인 AI Assistant</b><button class="btn ghost" onclick="toggleStudentAi()">닫기</button></div><div class="ai-body"><div class="ai-message">현재 선택한 대상자의 차트 맥락에서 작성 흐름을 도와드립니다. 진단을 대신하지 않습니다.</div><textarea placeholder="질문을 입력하세요"></textarea><div class="actions"><button class="btn primary" onclick="fakeAiChat()">보내기</button><button class="btn ghost" disabled>첨부 shell</button></div><div class="muted" style="font-size:11px;margin-top:8px">이 개인 대화는 교수 화면에 노출되지 않습니다.</div></div></div>
<script src="/demo-data.js"></script>
<script>
const seed=window.HYSTEP_DEMO_DATA;const data=JSON.parse(JSON.stringify(seed));let role=null,selectedParticipant=null,selectedSection='s1',reviewIndex=0,reviewMode=false,inlineAi=true,sortMode='name',pdfMode=false;let customOrder=data.students.map(s=>s.id);
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const section=id=>data.sections.find(s=>s.id===id),participant=id=>data.participants.find(p=>p.id===id),student=id=>data.students.find(s=>s.id===id);
const waiting=()=>data.participants.filter(p=>Object.keys(p.signatureRequests).length).sort((a,b)=>oldest(a).localeCompare(oldest(b)));const oldest=p=>Object.values(p.signatureRequests).sort()[0]||'9999';
function sectionState(p,id){if(p.professorEvaluations[id]?.signedAt)return'서명 완료';if(p.signatureRequests[id])return role==='professor'?'서명 대기':'서명 요청';if(p.sectionDrafts[id])return'작성 중';return'미작성'}
function counts(p){const out={'미작성':0,'작성 중':0,'서명 대기':0,'서명 완료':0};data.sections.forEach(s=>{let v=sectionState(p,s.id);if(v==='서명 요청')v='서명 대기';out[v]++});return out}
function renderHeader(){document.getElementById('courseDisplay').innerHTML=role?`<input class="editable" aria-label="과목명" value="${esc(data.course.name)}" oninput="data.course.name=this.value"><input class="editable term" aria-label="학기명" value="${esc(data.course.term)}" oninput="data.course.term=this.value">`:'';document.getElementById('topActions').innerHTML=role?`<button class="btn ghost" onclick="leave()">역할 다시 선택</button>`:''}
function leave(){role=null;selectedParticipant=null;reviewMode=false;document.getElementById('studentAi').classList.add('hidden');renderRole()}
function renderRole(){renderHeader();app.innerHTML=`<section class="hero"><div class="muted">동일한 차트 · 역할에 따른 권한 차이</div><h1>Hy-STEP 역할 기반 Preview</h1><p>입력 없이 역할을 선택해 학생과 교수 흐름을 이어서 체험합니다.</p><div class="role-grid"><button class="role" onclick="enter('student')"><h2>학생 체험</h2><p class="muted">8 Sections 작성, 서명 요청, 공개 코멘트, 개인 AI Assistant</p><span class="btn primary">학생으로 시작</span></button><button class="role" onclick="enter('professor')"><h2>교수 체험</h2><p class="muted">학생카드, 대상자 queue, 연속 검토, 코멘트와 서명</p><span class="btn primary">교수로 시작</span></button></div></section>`}
function enter(next){role=next;selectedParticipant=null;renderHeader();next==='student'?renderStudent():renderProfessor()}
function renderStudent(){const mine=data.participants.filter(p=>p.studentId==='stu-01');if(!selectedParticipant)selectedParticipant=mine[0].id;document.getElementById('topActions').innerHTML=`<button class="btn active-toggle" onclick="toggleStudentAi()">개인 AI 열기</button><button class="btn ghost" onclick="leave()">역할 다시 선택</button>`;app.innerHTML=`<div class="grid"><aside class="panel"><div class="panel-head"><b>대상자 목록</b><span class="muted">김하늘 학생</span></div><div class="panel-body list">${mine.map(p=>personButton(p)).join('')}</div></aside><section id="chartHost"></section></div>`;renderChart()}
function personButton(p){return`<button class="person ${selectedParticipant===p.id?'active':''}" onclick="selectPerson('${p.id}')"><b>${esc(p.name)}</b><div class="muted">${p.visitDates.length?p.visitDates.join(' · '):'내원일 없음'} · ${p.hasPhoto?'✓ 포토':'[포토]'}</div><div class="chips">${p.aiKeywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></button>`}
function toggleStudentAi(){if(role!=='student')return;document.getElementById('studentAi').classList.toggle('hidden')}function fakeAiChat(){alert('Prototype shell: 개인 AI 응답이 생성되었습니다. 이 대화는 교수에게 노출되지 않습니다.')}
function selectPerson(id){selectedParticipant=id;selectedSection='s1';role==='student'?renderStudent():renderChart()}function changeSection(id){selectedSection=id;renderChart()}
function signedModified(p,id){const ev=p.professorEvaluations[id];return Boolean(ev?.signedAt&&p.modifiedAfterSign?.[id])}
function renderChart(){const p=participant(selectedParticipant),host=document.getElementById('chartHost')||app,s=section(selectedSection),st=sectionState(p,s.id),ev=p.professorEvaluations[s.id]||{};host.innerHTML=`${reviewMode?reviewNavigation():''}<div class="panel"><div class="panel-head"><div><b>${esc(p.name)} · 공통 차트</b><div class="muted">${esc(data.course.name)} · ${esc(data.course.term)}</div></div><span class="status ${st.includes('대기')||st.includes('요청')?'wait':st.includes('완료')?'signed':''}">${st}</span></div><div class="panel-body"><div class="section-tabs">${data.sections.map(x=>`<button class="section-tab ${x.id===s.id?'active':''}" onclick="changeSection('${x.id}')">${x.id.slice(1)}. ${esc(x.name)}</button>`).join('')}</div><div class="chart-card"><h3>${esc(s.name)}</h3><textarea id="draft" ${role==='professor'?'readonly':''} placeholder="차트 내용을 입력하세요">${esc(p.sectionDrafts[s.id]||'')}</textarea>${signedModified(p,s.id)?'<div class="warning">⚠ 서명 이후 내용이 수정되었습니다.</div>':''}${role==='student'?studentActions(p,s):''}${ev.signedAt&&ev.publicComment?`<div class="comment"><b>교수 공개 코멘트</b><div>${esc(ev.publicComment)}</div></div>`:''}${role==='professor'?professorEvaluation(p,s,ev):''}</div></div></div>`}
function studentActions(p,s){return`<div class="actions"><button class="btn primary" onclick="saveDraft()">작성 내용 반영</button><button class="btn ${p.signatureRequests[s.id]?'danger':'ghost'}" onclick="toggleRequest()">${p.signatureRequests[s.id]?'서명 요청 철회':'서명 요청'}</button></div>${inlineAi?`<div class="ai-rec"><b>✨ AI 추천</b><p class="muted">현재 입력된 차트 내용을 바탕으로 생성되었습니다.</p><div id="aiSuggestion">대상자의 자가관리 실천 내용을 구체적으로 기록해보세요.</div><div class="actions"><button class="btn primary" onclick="applySuggestion()">적용</button><button class="btn ghost" onclick="showEvidence()">근거 보기</button><button class="btn ghost" onclick="refreshSuggestion()">새로고침</button></div></div>`:''}`}
function applySuggestion(){const t=document.getElementById('draft');t.value=(t.value?t.value+'\\n':'')+'자가관리 실천 내용을 추가 확인했습니다.'}function showEvidence(){alert('근거 보기 shell: 현재 Section의 작성 필드와 대상자 내원 기록을 참조했습니다.')}function refreshSuggestion(){document.getElementById('aiSuggestion').textContent='추가 정보 필요: 최근 내원 시 실천 변화를 입력해주세요.'}
function saveDraft(){const p=participant(selectedParticipant),wasSigned=p.professorEvaluations[selectedSection]?.signedAt;p.sectionDrafts[selectedSection]=document.getElementById('draft').value;if(wasSigned){p.modifiedAfterSign=p.modifiedAfterSign||{};p.modifiedAfterSign[selectedSection]=true}renderStudent()}
function toggleRequest(){const p=participant(selectedParticipant);if(p.signatureRequests[selectedSection])delete p.signatureRequests[selectedSection];else p.signatureRequests[selectedSection]=new Date().toISOString();renderStudent()}
function sortedStudents(){let list=[...data.students];if(sortMode==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));else if(sortMode==='number')list.sort((a,b)=>a.studentNo.localeCompare(b.studentNo));else list.sort((a,b)=>customOrder.indexOf(a.id)-customOrder.indexOf(b.id));return list}
function renderProfessor(){document.getElementById('studentAi').classList.add('hidden');reviewMode=false;const q=waiting(),done=data.participants.filter(p=>Object.values(p.professorEvaluations).some(e=>e.signedAt?.startsWith(data.demoToday))).length;document.getElementById('topActions').innerHTML=`<button class="btn ghost" onclick="exportShell('전체 PDF')">전체 PDF</button><button class="btn ghost" onclick="togglePdfMode()">선택 PDF</button><button class="btn ghost" onclick="exportShell('평가 현황 Excel')">평가 현황 Excel</button><button class="btn ${inlineAi?'active-toggle':'ghost'}" onclick="toggleInlineAi()">Inline AI ${inlineAi?'ON':'OFF'}</button><button class="btn ghost" onclick="leave()">역할 다시 선택</button>`;app.innerHTML=`<div class="kpis"><div class="kpi"><span class="muted">서명 대기 대상자</span><b>${q.length}</b></div><div class="kpi"><span class="muted">오늘 완료한 서명</span><b>${done}</b></div><div class="kpi"><span class="muted">연속 검토</span><button class="btn primary" onclick="continuousReview()">연속 검토 + 서명</button></div></div><div class="panel"><div class="panel-head"><b>학생카드</b><div class="toolbar"><button class="btn ${sortMode==='name'?'active-toggle':'ghost'}" onclick="setSort('name')">가나다순</button><button class="btn ${sortMode==='number'?'active-toggle':'ghost'}" onclick="setSort('number')">학번순</button><button class="btn ${sortMode==='custom'?'active-toggle':'ghost'}" onclick="setSort('custom')">사용자 지정</button></div></div><div class="panel-body"><div class="student-grid" id="studentGrid">${sortedStudents().map(studentCard).join('')}</div></div></div>`;bindDrag()}
function studentCard(s){const ps=data.participants.filter(p=>p.studentId===s.id);return`<article class="student-card" draggable="true" data-student="${s.id}"><div class="student-head"><div><b>${esc(s.name)}</b><div class="muted">${esc(s.studentNo)} · ${esc(s.group)}</div></div><span class="drag" title="드래그하여 사용자 지정 정렬">⠿</span></div><div class="participant-list">${ps.map(participantRow).join('')||'<span class="muted">대상자 없음</span>'}</div></article>`}
function participantRow(p){const c=counts(p);return`<button class="participant-row ${p.pdfSelected?'pdf-selected':''}" onclick="rowClick('${p.id}')"><div class="row-top"><b>${esc(p.name)}</b><span title="포토 여부">${p.hasPhoto?'✓ 포토':'-'}</span></div><div class="dates">${p.visitDates.length?p.visitDates.join(' · '):'내원일 없음'}</div><span class="muted" style="font-size:9px">AI 키워드</span><div class="chips">${p.aiKeywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div><div class="counts">${['미작성','작성 중','서명 대기','서명 완료'].map(k=>`<span class="count">${k}<strong>${c[k]}</strong></span>`).join('')}</div></button>`}
function rowClick(id){if(pdfMode){participant(id).pdfSelected=!participant(id).pdfSelected;renderProfessor()}else openProfessorChart(id)}function togglePdfMode(){pdfMode=!pdfMode;renderProfessor()}function exportShell(kind){const selected=data.participants.filter(p=>p.pdfSelected).length;alert(`${kind} shell${kind==='선택 PDF'?` · 선택 ${selected}명`:''}`)}
function setSort(mode){sortMode=mode;renderProfessor()}function bindDrag(){document.querySelectorAll('.student-card').forEach(card=>{card.ondragstart=()=>card.classList.add('dragging');card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>e.preventDefault();card.ondrop=e=>{e.preventDefault();const from=document.querySelector('.dragging')?.dataset.student,to=card.dataset.student;if(!from||from===to)return;customOrder=sortedStudents().map(s=>s.id);customOrder.splice(customOrder.indexOf(from),1);customOrder.splice(customOrder.indexOf(to),0,from);sortMode='custom';renderProfessor()}})}
function toggleInlineAi(){inlineAi=!inlineAi;renderProfessor()}function openProfessorChart(id){selectedParticipant=id;selectedSection=Object.keys(participant(id).signatureRequests)[0]||'s1';app.innerHTML='<section id="chartHost"></section>';renderChart()}
function professorEvaluation(p,s,ev){return`<div class="evaluation"><b>교수 평가</b><div class="two" style="margin-top:10px"><label><span class="muted">공개 코멘트</span><textarea id="publicComment">${esc(ev.publicComment||'')}</textarea></label><label><span class="muted">비공개 코멘트</span><textarea id="privateComment">${esc(ev.privateComment||'')}</textarea></label></div><div class="actions"><button class="btn primary" onclick="signSection()">서명</button><span class="muted">코멘트 없이도 서명할 수 있습니다.</span></div></div>`}
function continuousReview(){const q=waiting();if(!q.length)return alert('서명 대기 대상자가 없습니다.');reviewMode=true;reviewIndex=0;openReviewAt(0)}function openReviewAt(i){const q=waiting();if(!q.length)return renderProfessor();reviewIndex=Math.max(0,Math.min(i,q.length-1));reviewMode=true;selectedParticipant=q[reviewIndex].id;selectedSection=Object.keys(q[reviewIndex].signatureRequests)[0]||'s1';app.innerHTML='<section id="chartHost"></section>';renderChart()}
function reviewNavigation(){const q=waiting();return`<div class="review-nav"><button class="btn ghost" onclick="openReviewAt(${reviewIndex-1})" ${reviewIndex===0?'disabled':''}>← 이전</button><b>연속 검토 ${reviewIndex+1} / ${q.length}</b><button class="btn ghost" onclick="openReviewAt(${reviewIndex+1})" ${reviewIndex>=q.length-1?'disabled':''}>다음 →</button></div>`}
function signSection(){const p=participant(selectedParticipant);p.professorEvaluations[selectedSection]={publicComment:document.getElementById('publicComment').value,privateComment:document.getElementById('privateComment').value,signedAt:data.demoToday+'T'+new Date().toISOString().slice(11)};delete p.signatureRequests[selectedSection];if(reviewMode){const q=waiting();if(q.length)openReviewAt(Math.min(reviewIndex,q.length-1));else renderProfessor()}else renderProfessor()}
renderRole();
</script>
</body>
</html>
