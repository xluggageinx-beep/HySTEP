<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hy-STEP Preview</title>
  <style>
    :root{--navy:#12335f;--primary:#2a6fdb;--primary-dark:#1d56ad;--primary-50:#eef5ff;--ink:#172033;--muted:#667085;--line:#dbe3ef;--bg:#f5f7fb;--success:#16815d;--warning:#a86408;--card:#fff;--radius:14px;--shadow:0 8px 24px rgba(18,51,95,.07)}
    *{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input{font:inherit}
    button{cursor:pointer}.top{min-height:68px;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:10px 24px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;color:var(--navy)}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--primary),var(--navy));display:grid;place-items:center;color:white}.course{display:flex;align-items:center;gap:8px}.editable{min-width:180px;border:0;border-bottom:1px dashed #aab7c8;padding:5px 4px;background:transparent;font-weight:800;color:var(--ink)}.editable.semester{min-width:145px;font-size:13px;color:var(--muted);font-weight:650}.shell{max-width:1480px;margin:auto;padding:26px 22px 48px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:750;line-height:1.2}.primary{background:var(--primary);color:white;box-shadow:0 4px 10px rgba(42,111,219,.18)}.primary:hover{background:var(--primary-dark)}.ghost{background:white;border:1px solid var(--line);color:#344054}.ghost:hover{background:#f8fafc}.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
    .role-intro{text-align:center;margin:64px auto 24px;max-width:620px}.role-intro h1{font-size:34px;margin:8px 0 10px;color:var(--navy)}.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:18px;justify-content:center}.role{background:white;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:left;box-shadow:var(--shadow);transition:.18s}.role:hover{transform:translateY(-3px);border-color:#a9c5ef}.role-icon{width:44px;height:44px;border-radius:12px;background:var(--primary-50);display:grid;place-items:center;font-size:22px}.role h2{margin:18px 0 8px;font-size:22px;color:var(--navy)}.role .btn{display:inline-block;margin-top:14px}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h1{margin:4px 0;font-size:28px;color:var(--navy)}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.student-list{max-width:900px;margin:auto;padding:20px}.person{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:17px 4px;border-bottom:1px solid var(--line)}.person:last-child{border:0}.person-name{font-size:17px;font-weight:850}.person-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:7px;font-size:13px;color:var(--muted)}.photo{font-weight:750;color:var(--primary)}.feedback{color:var(--success);font-weight:750}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;color:#35517a;background:#edf4ff;border:1px solid #d7e6fb;border-radius:999px;padding:4px 8px}
    .dashboard-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:17px}.dashboard-head h1{margin:4px 0 0;font-size:28px;color:var(--navy)}.metrics-action{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr)) minmax(220px,auto);gap:12px;margin-bottom:18px}.kpi{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px}.kpi b{font-size:29px;display:block;margin-top:4px;color:var(--navy)}.review-action{background:linear-gradient(135deg,var(--navy),#205b9d);border-radius:var(--radius);padding:17px 18px;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}.review-action .btn{background:white;color:var(--navy);white-space:nowrap}.sortbar{display:flex;align-items:center;gap:8px;margin:6px 0 14px}.sortbar .label{font-size:13px;font-weight:750;color:var(--muted);margin-right:3px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.student-card{aspect-ratio:3/4;background:white;border:1px solid var(--line);border-radius:16px;padding:15px;display:flex;flex-direction:column;min-height:410px;box-shadow:0 4px 14px rgba(18,51,95,.05)}.student-card.dragging{opacity:.48}.card-head{display:flex;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid #edf0f5}.student-name{font-size:17px;font-weight:850;color:var(--navy)}.student-meta{font-size:12px;color:var(--muted);margin-top:3px}.drag{color:#98a2b3;font-size:18px}.rows{display:grid;gap:9px;margin-top:11px;overflow:auto;padding-right:2px}.participant-row{border:1px solid var(--line);background:white;border-radius:11px;padding:11px;text-align:left;color:inherit;width:100%}.participant-row:hover,.participant-row.selected{border-color:#8bb4ed;background:#f7faff}.row-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.dates{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.photo-mark{font-size:13px;font-weight:850;color:var(--primary)}.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:9px}.count{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:11px;color:#475467;background:#f2f4f7;border-radius:6px;padding:5px 7px}.count b{font-size:13px;color:var(--ink)}.empty{padding:15px;color:var(--muted);text-align:center}
    @media(min-width:1780px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.metrics-action{grid-template-columns:repeat(2,1fr)}.review-action{grid-column:1/-1}.top{grid-template-columns:auto 1fr}.top .toolbar{grid-column:1/-1;justify-content:flex-start}}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-head,.page-head{display:block}.dashboard-head .toolbar{justify-content:flex-start;margin-top:14px}.top{position:static}.course{flex-wrap:wrap}}
    @media(max-width:560px){.shell{padding:20px 14px 36px}.top{padding:10px 14px;display:flex;flex-wrap:wrap}.course{order:3;width:100%}.editable{min-width:0;flex:1}.role-grid,.grid,.metrics-action{grid-template-columns:1fr}.role-intro{margin-top:34px}.role-intro h1{font-size:28px}.student-card{aspect-ratio:auto;min-height:390px}.person{grid-template-columns:1fr}.person .btn{width:100%}.review-action{grid-column:auto}.toolbar{justify-content:flex-start}.dashboard-head h1,.page-head h1{font-size:24px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark">H</span>Hy-STEP</div>
    <div class="course" id="course"></div>
    <div class="toolbar" id="actions"></div>
  </header>
  <main class="shell" id="app"></main>
  <script src="/prototype-store.js"></script>
  <script>
    let role=null,sort='name',custom=[],selectedPdfParticipant=null;
    const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function state(){return PrototypeStore.getState()}
    function renderRole(){role=null;document.getElementById('course').innerHTML='';document.getElementById('actions').innerHTML='';app.innerHTML=`<div class="role-intro"><span class="eyebrow">Interactive Prototype</span><h1>하나의 차트, 역할에 맞는 경험</h1><p class="muted">학생과 교수는 같은 Hy-STEP 차트를 서로 다른 권한으로 사용합니다.</p></div><div class="role-grid"><button class="role" onclick="enter('student')"><span class="role-icon">✎</span><h2>학생 체험</h2><p class="muted">대상자를 선택해 차트를 작성하고 Section별로 서명을 요청합니다.</p><span class="btn primary">학생으로 시작</span></button><button class="role" onclick="enter('professor')"><span class="role-icon">✓</span><h2>교수 체험</h2><p class="muted">학생별 진행상태를 확인하고 동일한 차트에서 평가와 서명을 이어갑니다.</p><span class="btn primary">교수로 시작</span></button></div>`}
    function enter(r){role=r;document.getElementById('course').innerHTML='<input class="editable" aria-label="과목명" value="임상치위생학 실습"><input class="editable semester" aria-label="학기명" value="2026학년도 2학기">';r==='student'?studentView():professorView()}
    function commonActions(extra=''){document.getElementById('actions').innerHTML=extra+`<button class="btn ghost" onclick="renderRole()">역할 다시 선택</button>`}
    function participantStatus(p,s){const school=PrototypeStore.getSchoolForParticipant(p.participantId);const enabled=(school?.sections||[]).filter(x=>x.enabled);const evals=s.evaluations.filter(e=>e.participantId===p.participantId);const reqs=s.signatureRequests.filter(r=>r.participantId===p.participantId);const chart=s.charts.find(c=>c.participantId===p.participantId);if(evals.length===enabled.length&&enabled.length)return'서명 완료';if(reqs.length)return'서명 요청';if(chart&&Object.keys(chart.sectionData||{}).length)return'작성 중';return'미작성'}
    function latestPublicFeedback(p,s){return s.evaluations.some(e=>e.participantId===p.participantId&&e.signedAt&&e.publicComment)}
    function studentView(){commonActions(`<button class="btn ghost" onclick="alert('개인 AI shell: 나의 작성 스타일과 학습 흐름을 이어가며, 현재 대상자의 차트 맥락만 사용합니다. 교수 화면에는 공개되지 않습니다.')">개인 AI</button>`);const s=state(),student=s.students[0],participants=s.participants.filter(p=>p.studentId===student.studentId);app.innerHTML=`<div class="page-head"><div><span class="eyebrow">학생 대상자 목록</span><h1>${student.name} 학생</h1><p class="muted">대상자를 선택해 차트를 작성하고 교수 피드백을 확인하세요.</p></div></div><section class="panel student-list">${participants.map(p=>`<article class="person"><div><div class="person-name">${esc(p.name)}</div><div class="person-meta"><span>${p.visitDates.join(' · ')||'내원일 없음'}</span><span class="photo">${p.hasPhoto?'✓ 포토':'[포토]'}</span><span>${participantStatus(p,s)}</span>${latestPublicFeedback(p,s)?'<span class="feedback">새 공개 피드백</span>':''}</div><div class="chips">${p.aiKeywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></div><button class="btn primary" onclick="openChart('student','${p.participantId}')">차트 열기</button></article>`).join('')}</section>`}
    function waitingParticipants(s){const ids=[...new Set(s.signatureRequests.map(r=>r.participantId))];return ids.map(id=>s.participants.find(p=>p.participantId===id)).filter(Boolean)}
    function professorView(){const s=state(),waiting=waitingParticipants(s),today=new Date().toISOString().slice(0,10),done=s.evaluations.filter(e=>e.signedAt?.startsWith(today)).length;commonActions(`<button class="btn ghost" onclick="alert('서명 관리 shell')">서명 관리</button><button class="btn ghost" onclick="alert('전체 PDF shell')">전체 PDF</button><button class="btn ghost" onclick="alert('선택 PDF: 대상자 행을 선택한 뒤 출력하는 shell입니다.')">선택 PDF</button><button class="btn ghost" onclick="alert('평가 현황 Excel shell')">평가 현황 Excel</button><button class="btn ghost" onclick="alert('Inline AI 사용 가능 여부를 전환하는 Prototype shell입니다.')">Inline AI ON/OFF</button>`);if(!custom.length)custom=s.students.map(x=>x.studentId);const students=[...s.students].sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ko'):sort==='number'?a.studentNo.localeCompare(b.studentNo):custom.indexOf(a.studentId)-custom.indexOf(b.studentId));app.innerHTML=`<div class="dashboard-head"><div><span class="eyebrow">교수 대시보드</span><h1>학생별 임상실습 현황</h1></div><div class="muted">대상자 행을 클릭하면 선택 PDF 대상이 강조됩니다.</div></div><div class="metrics-action"><div class="kpi"><span class="muted">서명 대기 대상자</span><b>${waiting.length}</b></div><div class="kpi"><span class="muted">오늘 완료한 서명</span><b>${done}</b></div><div class="review-action"><div><b>연속 검토 + 서명</b><div style="opacity:.75;font-size:12px;margin-top:4px">오래된 요청부터 같은 차트에서 검토</div></div><button class="btn" onclick="continuous()">검토 시작</button></div></div><div class="sortbar"><span class="label">학생 정렬</span><button class="btn ${sort==='name'?'primary':'ghost'}" onclick="sort='name';professorView()">가나다순</button><button class="btn ${sort==='number'?'primary':'ghost'}" onclick="sort='number';professorView()">학번순</button><button class="btn ${sort==='custom'?'primary':'ghost'}" onclick="sort='custom';professorView()">사용자 지정</button></div><div class="grid">${students.map(st=>card(st,s)).join('')}</div>`;bindDrag()}
    function statusCounts(p,s){const out=[0,0,0,0],school=PrototypeStore.getSchoolForParticipant(p.participantId);(school?.sections||[]).filter(sec=>sec.enabled).forEach(sec=>{const ev=s.evaluations.find(e=>e.participantId===p.participantId&&e.sectionId===sec.sectionId),req=s.signatureRequests.find(r=>r.participantId===p.participantId&&r.sectionId===sec.sectionId),chart=s.charts.find(c=>c.participantId===p.participantId);if(ev)out[3]++;else if(req)out[2]++;else if(chart?.sectionData?.[sec.sectionId])out[1]++;else out[0]++});return out}
    function card(st,s){const group=s.groups.find(g=>g.groupId===st.groupId),ps=s.participants.filter(p=>p.studentId===st.studentId);return`<article class="student-card" draggable="true" data-id="${st.studentId}"><div class="card-head"><div><div class="student-name">${esc(st.name)}</div><div class="student-meta">${esc(st.studentNo)} · ${esc(group?.name||'-')}</div></div><span class="drag" title="끌어서 사용자 지정 정렬">⠿</span></div><div class="rows">${ps.map(p=>{const c=statusCounts(p,s);return`<button class="participant-row ${selectedPdfParticipant===p.participantId?'selected':''}" onclick="selectParticipant(event,'${p.participantId}')" ondblclick="openChart('professor','${p.participantId}')"><div class="row-head"><b>${esc(p.name)}</b><span class="photo-mark">${p.hasPhoto?'✓':'-'}</span></div><div class="dates">${p.visitDates.join(' · ')||'내원일 없음'}</div><div class="chips">${p.aiKeywords.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div><div class="counts">${['미작성','작성 중','서명 대기','서명 완료'].map((n,i)=>`<span class="count">${n}<b>${c[i]}</b></span>`).join('')}</div></button>`}).join('')||'<div class="empty">대상자 없음</div>'}</div></article>`}
    function selectParticipant(event,id){event.preventDefault();selectedPdfParticipant=selectedPdfParticipant===id?null:id;professorView()}
    function bindDrag(){document.querySelectorAll('.student-card').forEach(el=>{el.ondragstart=()=>el.classList.add('dragging');el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const from=document.querySelector('.dragging')?.dataset.id,to=el.dataset.id;if(!from||from===to)return;custom.splice(custom.indexOf(from),1);custom.splice(custom.indexOf(to),0,from);sort='custom';professorView()}})}
    function chartConfig(id){const school=PrototypeStore.getSchoolForParticipant(id);return encodeURIComponent(JSON.stringify({sections:(school?.sections||[]).filter(s=>s.enabled).map(s=>s.sectionId),dashboard:true,photo:Boolean(school?.features?.photo)}))}
    function openChart(r,id,continuousIndex=''){location.href=`/chart?prototype=1&role=${r}&participant=${id}&config=${chartConfig(id)}${continuousIndex!==''?`&queueIndex=${continuousIndex}`:''}`}
    function continuous(){const list=waitingParticipants(state());if(!list.length)return alert('서명 대기 대상자가 없습니다.');openChart('professor',list[0].participantId,0)}
    PrototypeStore.subscribe(()=>{if(role==='professor')professorView();if(role==='student')studentView()});renderRole();
  </script>
</body>
</html>
