<!-- 4. tooth-diagram.jsx: ToothIconDiagram, ToothCard, ToothChart2Row, ToothDiagram, ToothPicker -->
<script type="text/babel">
/* Tooth Chart — 2-row grid layout (16 upper, 16 lower).
   Each tooth is a soft rounded shape (incisor / premolar / molar silhouette),
   NO outline, muted fills. Chart symbols (Ex, G.I, C, Cw, P.Cr etc) overlay
   directly on the tooth image. Individual missing/status marks are shown as
   simple annotations. */

/* Chart symbol data — sample state matching the reference image */
const DEFAULT_TOOTH_STATE = {
  18: { sym: 'Ex' },      // extraction
  17: { sym: 'G.I' },
  16: { sym: 'G.I' },
  11: { sym: 'C', red: true },
  21: { sym: 'C', red: true },
  22: { sym: 'C', red: true },
  23: { sym: 'Cw' },
  25: { sym: 'C ck', red: true },
  26: { sym: 'P.Cr' },
  27: { sym: 'P.Cr' },
  28: { sym: 'Ex' },
  48: { sym: 'Ex' },
  47: { sym: 'G.IC' },
  46: { sym: 'G.IFx', arc: true },
  42: { sym: 'Fx Cw' },
  41: { sym: 'Cw' },
  31: { sym: 'Cw' },
  32: { sym: 'Cw' },
  36: { sym: 'G.I R.F' },
  37: { arc: true },
  38: { sym: 'Ex' },
};

const toothType = (num) => {
  const last = num % 10;
  if (last >= 6) return 'molar';
  if (last >= 4) return 'premolar';
  if (last === 3) return 'canine';
  return 'incisor';
};

/* Soft tooth silhouette — no outline, muted fill.
   Each type has its own shape. Rendered inside a 44x52 SVG. */
const ToothIconDiagram = ({ num, isUpper, state = {} }) => {
  const type = toothType(num);
  const baseFill = '#F2E9DA'; // warm off-white
  const shadowFill = '#E6D8BC';

  // We draw the tooth in a natural orientation for the arch:
  // Upper teeth: crown at bottom (occlusal down), roots at top
  // Lower teeth: crown at top (occlusal up), roots at bottom
  // For visual clarity in a grid we actually orient BOTH so their
  // crown (biting surface) faces the midline (upper→down, lower→up),
  // but roots are hidden by the card — we just draw the crown shape.

  let path;
  if (type === 'molar') {
    // wide crown with subtle cusp indents
    path = isUpper
      ? 'M 6,4 C 4,14 4,32 8,42 C 14,50 30,50 36,42 C 40,32 40,14 38,4 C 34,2 30,6 30,3 C 26,6 22,3 22,3 C 22,6 18,3 14,3 C 14,6 10,2 6,4 Z'
      : 'M 6,48 C 4,38 4,20 8,10 C 14,2 30,2 36,10 C 40,20 40,38 38,48 C 34,50 30,46 30,49 C 26,46 22,49 22,49 C 22,46 18,49 14,49 C 14,46 10,50 6,48 Z';
  } else if (type === 'premolar') {
    path = isUpper
      ? 'M 10,4 C 6,14 6,32 10,42 C 15,49 29,49 34,42 C 38,32 38,14 34,4 C 30,2 26,6 22,3 C 18,6 14,2 10,4 Z'
      : 'M 10,48 C 6,38 6,20 10,10 C 15,3 29,3 34,10 C 38,20 38,38 34,48 C 30,50 26,46 22,49 C 18,46 14,50 10,48 Z';
  } else if (type === 'canine') {
    path = isUpper
      ? 'M 22,3 C 14,4 10,10 10,20 C 10,32 12,42 15,46 C 20,50 28,50 30,46 C 32,42 34,32 34,20 C 34,10 30,4 22,3 Z'
      : 'M 22,49 C 14,48 10,42 10,32 C 10,20 12,10 15,6 C 20,2 28,2 30,6 C 32,10 34,20 34,32 C 34,42 30,48 22,49 Z';
  } else {
    // incisor — flat rectangular crown
    path = isUpper
      ? 'M 10,4 C 8,10 8,32 10,42 C 12,48 32,48 34,42 C 36,32 36,10 34,4 C 32,2 12,2 10,4 Z'
      : 'M 10,48 C 8,42 8,20 10,10 C 12,4 32,4 34,10 C 36,20 36,42 34,48 C 32,50 12,50 10,48 Z';
  }

  const isExtraction = state.sym === 'Ex';

  return (
    <svg viewBox="0 0 44 52" width="44" height="52" style={{ display: 'block' }}>
      {/* soft drop-shadow-like layer */}
      <path d={path} fill={shadowFill} transform="translate(0.5, 1)" opacity="0.45" />
      <path d={path} fill={isExtraction ? '#EEEEEE' : baseFill} />
      {/* cusp / anatomical line hint for molar/premolar */}
      {(type === 'molar' || type === 'premolar') && (
        <line
          x1="22" y1={isUpper ? 8 : 44} x2="22" y2={isUpper ? 40 : 12}
          stroke="#D9C7A2" strokeWidth="0.7" opacity="0.7"
        />
      )}
      {/* Extraction — diagonal cross */}
      {isExtraction && (
        <>
          <line x1="8" y1="8" x2="36" y2="44" stroke="#C4A489" strokeWidth="1.8" strokeLinecap="round" />
          <line x1="36" y1="8" x2="8" y2="44" stroke="#C4A489" strokeWidth="1.8" strokeLinecap="round" />
        </>
      )}
      {/* Arc annotation (like a small curve under the tooth — recession/mobility marker) */}
      {state.arc && (
        <path d="M 12 46 Q 22 52 32 46" fill="none" stroke="#C4A489" strokeWidth="1.4" strokeLinecap="round" />
      )}
    </svg>
  );
};

/* One tooth card — combines the tooth icon and its charting symbol */
const ToothCard = ({ num, isUpper, state = {}, small = false }) => {
  const sym = state.sym;
  const symColor = state.red ? '#DC2626' : '#2A6FDB';

  return (
    <div className={`tc ${small ? 'small' : ''}`}>
      <div className="tc-num" style={{ order: isUpper ? -1 : 2 }}>{num}</div>
      <div className="tc-body">
        <ToothIconDiagram num={num} isUpper={isUpper} state={state} />
        {sym && (
          <div className="tc-sym" style={{ color: symColor }}>{sym}</div>
        )}
      </div>
    </div>
  );
};

/* Full tooth chart — 2 rows of 16 teeth each, with a midline gap between quadrants */
const ToothChart2Row = ({ state = DEFAULT_TOOTH_STATE, small = false }) => {
  const upper = [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28];
  const lower = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];
  return (
    <div className={`tooth-chart-2row ${small ? 'small' : ''}`}>
      <div className="tc-row upper">
        {upper.map((n, i) => (
          <React.Fragment key={n}>
            {i === 8 && <div className="tc-midline" />}
            <ToothCard num={n} isUpper={true} state={state[n] || {}} small={small} />
          </React.Fragment>
        ))}
      </div>
      <div className="tc-occlusal" />
      <div className="tc-row lower">
        {lower.map((n, i) => (
          <React.Fragment key={n}>
            {i === 8 && <div className="tc-midline" />}
            <ToothCard num={n} isUpper={false} state={state[n] || {}} small={small} />
          </React.Fragment>
        ))}
      </div>
    </div>
  );
};

/* Legacy wrapper: still exposed as ToothDiagram for existing callers */
const ToothDiagram = ({ selectedTeeth = [], onToggle }) => {
  // Section 2 usage — same 2-row chart with default charting state
  return <ToothChart2Row state={DEFAULT_TOOTH_STATE} />;
};

const ToothPicker = ({ selected = [], disabled = [], onToggle }) => {
  const rows = [
    [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28],
    [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38],
  ];
  // Accept both Array and Set for disabled/selected
  const has = (col, n) => col instanceof Set ? col.has(n) : Array.isArray(col) && col.includes(n);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, padding: 12, background: '#F8FAFC', borderRadius: 8, border: '1px solid #E5E9F0' }}>
      {rows.map((row, i) => (
        <div key={i} style={{ display: 'grid', gridTemplateColumns: 'repeat(16, 1fr)', gap: 4 }}>
          {row.map(n => {
            const isDisabled = has(disabled, n);
            const isSelected = has(selected, n);
            return (
              <button
                key={n}
                className={`tooth-block ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}`}
                onClick={() => !isDisabled && onToggle && onToggle(n)}
                disabled={isDisabled}
              >{n}</button>
            );
          })}
        </div>
      ))}
    </div>
  );
};

Object.assign(window, { ToothDiagram, ToothPicker, ToothChart2Row, ToothCard, ToothIconDiagram, DEFAULT_TOOTH_STATE });

</script>

<!-- 5. tooth-chart-new.jsx: ToothIcon (new), NotationChart, CombinedChart, CalculusChart -->
<script type="text/babel">
/* New Tooth Chart:
   - 2-row layout (upper row, lower row), no arch
   - Each tooth is a soft-filled shape (incisor/premolar/molar), no outline
   - Chart notation glyphs overlay the tooth
   - Per-tooth annotation cells above/below for PD/BOP/Mob/SW/Cal
*/

const TEETH_UPPER = [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28];
const TEETH_LOWER = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];

const toothCategory = (n) => {
  const last = n % 10;
  if (last >= 6) return 'molar';
  if (last >= 4) return 'premolar';
  if (last === 3) return 'canine';
  return 'incisor';
};

/* Simple tooth silhouette. Filled soft color, no outline.
   viewBox 40 x 52. Crown occupies upper half, root(s) lower half.
   `flip` = true → root points up (for upper arch teeth so roots are near gum line at top of image)
   Actually we use SAME visual shape (crown up) for both rows because it's a
   diagrammatic 2-row layout, not anatomical arch. */
const ToothIcon = ({ category, missing, selected, className, style }) => {
  const bodyFill = missing ? '#F1F5F9' : selected ? '#DBEAFE' : '#F4EFE1'; // warm ivory
  const rootFill = missing ? '#E2E8F0' : selected ? '#BFDBFE' : '#E8DFC6';

  let crown, root;
  if (category === 'molar') {
    crown = <path d="M 6,20 C 6,10 12,4 20,4 C 28,4 34,10 34,20 L 34,26 C 30,30 26,26 22,30 C 20,26 18,30 14,26 C 10,30 6,26 6,20 Z" fill={bodyFill} />;
    root = <path d="M 8,24 L 6,44 M 20,24 L 20,46 M 32,24 L 34,44" stroke={rootFill} strokeWidth="6" fill="none" strokeLinecap="round" />;
  } else if (category === 'premolar') {
    crown = <path d="M 10,20 C 10,10 14,5 20,5 C 26,5 30,10 30,20 L 30,26 C 26,30 22,26 20,30 C 18,26 14,30 10,26 Z" fill={bodyFill} />;
    root = <path d="M 13,24 L 11,46 M 27,24 L 29,46" stroke={rootFill} strokeWidth="5" fill="none" strokeLinecap="round" />;
  } else if (category === 'canine') {
    crown = <path d="M 12,26 L 12,17 C 12,9 15,4 20,3 C 25,4 28,9 28,17 L 28,26 C 25,30 22,26 20,30 C 18,26 15,30 12,26 Z" fill={bodyFill} />;
    root = <path d="M 20,24 L 20,48" stroke={rootFill} strokeWidth="5" fill="none" strokeLinecap="round" />;
  } else {
    // incisor
    crown = <path d="M 12,26 L 12,10 C 12,6 15,3 20,3 C 25,3 28,6 28,10 L 28,26 C 25,30 22,26 20,30 C 18,26 15,30 12,26 Z" fill={bodyFill} />;
    root = <path d="M 20,24 L 20,48" stroke={rootFill} strokeWidth="4" fill="none" strokeLinecap="round" />;
  }

  return (
    <svg viewBox="0 0 40 52" className={className} style={style} width="100%" height="100%">
      {root}
      {crown}
      {missing && <line x1="6" y1="6" x2="34" y2="46" stroke="#94A3B8" strokeWidth="1.6" />}
    </svg>
  );
};

/* ============ Notation glyphs overlay ============ */
// Displays the "chart notation" symbols directly ON the tooth
const NotationOverlay = ({ code, isUpper }) => {
  if (!code) return null;
  const map = {
    'Ex':    { text: 'Ex',    color: '#0F172A', style: 'text' },
    'C':     { text: 'C',     color: '#DC2626', style: 'text' },
    'Cw':    { text: 'Cw',    color: '#2A6FDB', style: 'text' },
    'C ck':  { text: 'C ck',  color: '#DC2626', style: 'text' },
    'G.I':   { text: 'G.I',   color: '#2A6FDB', style: 'text' },
    'G.IC':  { text: 'G.IC',  color: '#2A6FDB', style: 'text' },
    'G.IFx': { text: 'G.IFx', color: '#2A6FDB', style: 'text' },
    'P.Cr':  { text: 'P.Cr',  color: '#2A6FDB', style: 'text' },
    'G.IR.F':{ text: 'G.IR.F',color: '#2A6FDB', style: 'text' },
    'Fx':    { text: 'Fx',    color: '#DC2626', style: 'text' },
    'Fx Cw': { text: 'Fx Cw', color: '#DC2626', style: 'text' },
  };
  const conf = map[code];
  if (!conf) return null;
  return (
    <div style={{
      position: 'absolute', inset: 0,
      display: 'grid', placeItems: 'center',
      pointerEvents: 'none',
      fontSize: 10.5, fontWeight: 700, color: conf.color,
      fontFamily: 'Pretendard, sans-serif',
      textShadow: '0 0 3px rgba(255,253,246,0.9), 0 0 3px rgba(255,253,246,0.9)',
    }}>{conf.text}</div>
  );
};

/* ============ Chart Tab (notation only) ============ */
const NotationChart = ({ notationMap = {}, missingSet = new Set(), onCellClick }) => {
  const renderRow = (teeth, isUpper) => (
    <div className="tooth-row">
      {teeth.map(n => {
        const cat = toothCategory(n);
        const missing = missingSet.has(n);
        const code = notationMap[n];
        return (
          <div key={n} className="tooth-cell" onClick={() => onCellClick && onCellClick(n)}>
            <div className="tooth-num">{n}</div>
            <div className="tooth-body">
              <ToothIcon category={cat} missing={missing} />
              <NotationOverlay code={code} isUpper={isUpper} />
            </div>
          </div>
        );
      })}
    </div>
  );
  return (
    <div className="tooth-chart-new">
      {renderRow(TEETH_UPPER, true)}
      <div className="occlusal-line" />
      {renderRow(TEETH_LOWER, false)}
    </div>
  );
};

/* ============ Combined PD/BOP/Mob/SW Chart (NEW 10-row layout) ============
   Row structure (per-tooth spans 3 sub-cells for PD, 1 cell for BOP):
     1: BOP 상악 (한 칸)                    click → red dot toggle
     2: PD 상악 Buccal (3 칸 · MB/B/DB)     click → number select popover (0-9)
     3: 상악 치아 아이콘 (with notation)
     4: Mob / Sw 상악                        optional select
     5: PD 상악 Lingual (3 칸 · ML/L/DL)
     -- occlusal separator --
     6: PD 하악 Lingual (3 칸)
     7: Mob / Sw 하악
     8: 하악 치아 아이콘 (상하 반전)
     9: PD 하악 Buccal (3 칸)
     10: BOP 하악 (한 칸)
   All entries are OPTIONAL (Mob/Sw/BOP/PD 필수 아님).
*/

const PDCell = ({ value, onChange }) => {
  const [open, setOpen] = React.useState(false);
  return (
    <div className="pd-cell" onClick={(e) => { e.stopPropagation(); setOpen(o => !o); }}>
      {value != null && value !== '' ? (
        <span className={Number(value) >= 4 ? 'pd-num warn' : 'pd-num'}>{value}</span>
      ) : (
        <span className="pd-empty">·</span>
      )}
      {open && (
        <div className="pd-pop" onClick={e => e.stopPropagation()}>
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n}
              className={`pd-opt ${n >= 4 ? 'warn' : ''} ${Number(value) === n ? 'active' : ''}`}
              onClick={() => { onChange(n); setOpen(false); }}
            >{n}</button>
          ))}
          <button className="pd-opt clear" onClick={() => { onChange(null); setOpen(false); }}>×</button>
        </div>
      )}
    </div>
  );
};

const BOPCell = ({ value, onClick }) => (
  <div className="bop-cell" onClick={onClick}>
    {value ? <span className="bop-red-dot" /> : null}
  </div>
);

const MobSwCell = ({ value, onChange }) => {
  const [open, setOpen] = React.useState(false);
  return (
    <div className="mobsw-cell" onClick={(e) => { e.stopPropagation(); setOpen(o => !o); }}>
      {value ? <span className={`mobsw-badge ${value.startsWith('M') ? 'm' : 's'}`}>{value}</span> : <span className="mobsw-empty">·</span>}
      {open && (
        <div className="mobsw-pop" onClick={e => e.stopPropagation()}>
          {['M1','M2','M3'].map(v => (
            <button key={v} className={`mobsw-opt m ${value === v ? 'active' : ''}`} onClick={() => { onChange(v); setOpen(false); }}>{v}</button>
          ))}
          {['Sw'].map(v => (
            <button key={v} className={`mobsw-opt s ${value === v ? 'active' : ''}`} onClick={() => { onChange(v); setOpen(false); }}>{v}</button>
          ))}
          <button className="mobsw-opt clear" onClick={() => { onChange(null); setOpen(false); }}>×</button>
        </div>
      )}
    </div>
  );
};

const CombinedChart = ({ notationMap = {}, missingSet = new Set() }) => {
  // State per tooth. All optional.
  const [pd, setPd] = React.useState({
    // format: { toothNum: { buccal: [n,n,n], lingual: [n,n,n] } }
    16: { buccal: [3, 4, 3], lingual: [3, 3, 3] },
    26: { buccal: [5, 4, 5], lingual: [3, 3, 4] },
    27: { buccal: [5, 4, 4], lingual: [3, 3, 3] },
    46: { buccal: [3, 4, 3], lingual: [3, 3, 4] },
  });
  const [bop, setBop] = React.useState({ 16: 1, 26: 1, 27: 1, 46: 1, 12: 1, 22: 1, 41: 1 });
  const [mobsw, setMobsw] = React.useState({ 13: 'M1', 26: 'Sw', 27: 'Sw', 42: 'M2' });

  const setPdVal = (n, surface, i, v) => {
    setPd(prev => {
      const t = prev[n] || { buccal: [null,null,null], lingual: [null,null,null] };
      const arr = [...(t[surface] || [null,null,null])];
      arr[i] = v;
      return { ...prev, [n]: { ...t, [surface]: arr } };
    });
  };
  const toggleBop = (n) => setBop(prev => ({ ...prev, [n]: prev[n] ? 0 : 1 }));
  const setMobSw = (n, v) => setMobsw(prev => ({ ...prev, [n]: v }));

  const renderPDStrip = (n, surface) => {
    const arr = (pd[n] && pd[n][surface]) || [null, null, null];
    return (
      <div className="strip strip-pd-3">
        {[0,1,2].map(i => (
          <PDCell key={i} value={arr[i]} onChange={v => setPdVal(n, surface, i, v)} />
        ))}
      </div>
    );
  };

  const renderTooth = (n, flipped) => {
    const cat = toothCategory(n);
    const missing = missingSet.has(n);
    const code = notationMap[n];
    return (
      <div className="tooth-body" style={flipped ? { transform: 'scaleY(-1)' } : undefined}>
        <ToothIcon category={cat} missing={missing} />
        {code && (
          <div style={flipped ? { transform: 'scaleY(-1)', position: 'absolute', inset: 0 } : { position: 'absolute', inset: 0 }}>
            <NotationOverlay code={code} isUpper={!flipped} />
          </div>
        )}
      </div>
    );
  };

  const upperColumn = (n) => (
    <div key={n} className="combi-col-new">
      {/* 1: BOP upper */}
      <BOPCell value={bop[n]} onClick={() => toggleBop(n)} />
      {/* 2: PD upper Buccal */}
      {renderPDStrip(n, 'buccal')}
      {/* 3: Upper tooth */}
      <div className="tooth-slot upper">
        <div className="tooth-num-upper">{n}</div>
        {renderTooth(n, false)}
      </div>
      {/* 4: Mob/Sw upper */}
      <MobSwCell value={mobsw[n]} onChange={v => setMobSw(n, v)} />
      {/* 5: PD upper Lingual */}
      {renderPDStrip(n, 'lingual')}
    </div>
  );

  const lowerColumn = (n) => (
    <div key={n} className="combi-col-new">
      {/* 6: PD lower Lingual */}
      {renderPDStrip(n, 'lingual')}
      {/* 7: Mob/Sw lower */}
      <MobSwCell value={mobsw[n]} onChange={v => setMobSw(n, v)} />
      {/* 8: Lower tooth — flipped */}
      <div className="tooth-slot lower">
        {renderTooth(n, true)}
        <div className="tooth-num-lower">{n}</div>
      </div>
      {/* 9: PD lower Buccal */}
      {renderPDStrip(n, 'buccal')}
      {/* 10: BOP lower */}
      <BOPCell value={bop[n]} onClick={() => toggleBop(n)} />
    </div>
  );

  return (
    <div className="combined-chart-v2">
      <div className="combined-legend">
        <span><span className="bop-red-dot inline" /> BOP (셀 클릭)</span>
        <span><span className="pd-num">3</span> PD 정상</span>
        <span><span className="pd-num warn">4</span> PD ≥ 4mm</span>
        <span><span className="mobsw-badge m">M1</span> Mobility</span>
        <span><span className="mobsw-badge s">Sw</span> Swelling</span>
        <span style={{ marginLeft: 'auto', color: 'var(--ink-400)' }}>Mob·Sw·BOP·PD 모두 선택 입력</span>
      </div>

      {/* Upper arch — row labels on the left */}

const CalculusChart = ({ notationMap = {}, missingSet = new Set() }) => {

<script type="text/babel">
/* PI Chart — X-shape 4 quadrants per tooth, big grid.
   Reference: last attached image with 상악(Maxilla) row and 하악(Mandible) row.
*/

const PIChart = ({ data = {}, missingSet = new Set(), onToggle }) => {
  // data: { toothNum: [F, L, M, D] as 0/1 } — 4 quadrants per tooth
  const renderTooth = (n) => {
    const missing = missingSet.has(n);
    const arr = data[n] || [0, 0, 0, 0];
    const toggle = (i) => {
      if (missing) return;
      const next = [...arr]; next[i] = next[i] ? 0 : 1;
      onToggle && onToggle(n, next);
    };
    return (
      <div key={n} className={`pi-tooth ${missing ? 'disabled' : ''}`}>
        <div className="n">{n}</div>
        <svg viewBox="0 0 40 40" className="pi-x">
          <rect x="1" y="1" width="38" height="38" />
          <line x1="1" y1="1" x2="39" y2="39" />
          <line x1="39" y1="1" x2="1" y2="39" />
          {/* Click regions (transparent) — reveal a red dot at that quadrant's centroid */}
          <path d="M 1,1 L 39,1 L 20,20 Z" className="quad-hit" onClick={() => toggle(0)} />
          <path d="M 1,39 L 39,39 L 20,20 Z" className="quad-hit" onClick={() => toggle(1)} />
          <path d="M 1,1 L 1,39 L 20,20 Z" className="quad-hit" onClick={() => toggle(2)} />
          <path d="M 39,1 L 39,39 L 20,20 Z" className="quad-hit" onClick={() => toggle(3)} />
          {/* Red dots at quadrant centroids */}
          {arr[0] ? <circle cx="20" cy="8"  r="3" className="pi-red-dot" /> : null}
          {arr[1] ? <circle cx="20" cy="32" r="3" className="pi-red-dot" /> : null}
          {arr[2] ? <circle cx="8"  cy="20" r="3" className="pi-red-dot" /> : null}
          {arr[3] ? <circle cx="32" cy="20" r="3" className="pi-red-dot" /> : null}
        </svg>
      </div>
    );
  };

  // Summary calcs
  const activeTeeth = [...TEETH_UPPER, ...TEETH_LOWER].filter(n => !missingSet.has(n));
  const totalSurfaces = activeTeeth.length * 4;
  let dotted = 0;
  activeTeeth.forEach(n => {
    const arr = data[n] || [0,0,0,0];
    arr.forEach(v => { if (v) dotted++; });
  });
  const oleary = totalSurfaces > 0 ? (dotted / totalSurfaces * 100) : 0;
  // Modified O'Leary — for demo, count only teeth where at least 1 surface is dotted
  const modDotted = activeTeeth.filter(n => (data[n] || []).some(v => v)).length;
  const modTotal = activeTeeth.length;
  const modOleary = modTotal > 0 ? (modDotted / modTotal * 100) : 0;

  return (
    <div>
      <div className="pi-chart">
        <div className="pi-arch-heading">상악 (Maxilla)</div>
        <div className="pi-row">
          {TEETH_UPPER.map(renderTooth)}
        </div>
        <div className="pi-arch-heading" style={{ marginTop: 18 }}>하악 (Mandible)</div>
        <div className="pi-row">
          {TEETH_LOWER.map(renderTooth)}
        </div>
      </div>

      <div className="pi-summary">
        <div className="item">
          <div className="l">착색 치면 수</div>
          <div className="v">{dotted}</div>
        </div>
        <div className="item">
          <div className="l">전체 치면 수</div>
          <div className="v">{totalSurfaces}</div>
        </div>
        <div className="item hero">
          <div className="l">O'Leary Index</div>
          <div className="v">{oleary.toFixed(2)}<span style={{ fontSize: 16 }}>%</span></div>
        </div>
        <div className="item mod">
          <div className="l">Modified O'Leary Index</div>
          <div className="v">{modOleary.toFixed(2)}<span style={{ fontSize: 16 }}>%</span></div>
        </div>
      </div>
    </div>
  );
};

/* Multi-visit trend — line chart with area fill, grid, target line, delta chips */
const PITrend = ({
  points = [
    { label: '1회차', v: 58.93, date: '07.06' },
    { label: '2회차', v: 24.10, date: '07.20' },
    { label: '3회차', v: null, date: '08.03', planned: true, target: 15 },
    { label: '4회차', v: null, date: '08.24', planned: true, target: 10 },
  ],
  target = 20,
}) => {
  const W = 640, H = 220;
  const padL = 40, padR = 20, padT = 20, padB = 40;
  const iw = W - padL - padR;
  const ih = H - padT - padB;
  const maxY = 70;
  const yTicks = [0, 20, 40, 60];

  const xAt = (i) => padL + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const yAt = (v) => padT + ih - (v / maxY) * ih;

  const actual = points.map((p, i) => ({ ...p, i })).filter(p => p.v != null);
  const linePath = actual.map((p, k) => `${k === 0 ? 'M' : 'L'} ${xAt(p.i).toFixed(1)},${yAt(p.v).toFixed(1)}`).join(' ');
  const areaPath = actual.length >= 2
    ? `${linePath} L ${xAt(actual[actual.length - 1].i).toFixed(1)},${yAt(0)} L ${xAt(actual[0].i).toFixed(1)},${yAt(0)} Z`
    : '';

  // Projected (dashed) line from last actual point to future planned points
  const lastActual = actual[actual.length - 1];
  const plannedFuture = points.map((p, i) => ({ ...p, i })).filter(p => p.i > (lastActual?.i ?? -1) && (p.target != null));
  const projPath = lastActual && plannedFuture.length
    ? `M ${xAt(lastActual.i)},${yAt(lastActual.v)} ` + plannedFuture.map(p => `L ${xAt(p.i)},${yAt(p.target)}`).join(' ')
    : '';

  const latestDelta = actual.length >= 2 ? actual[actual.length - 1].v - actual[actual.length - 2].v : null;

  return (
    <div className="card" style={{ margin: 0 }}>
      <div className="card-head">
        <div>
          <div className="card-title">O'Leary Index 회차별 추이</div>
          <div className="card-sub">회차가 진행될수록 감소하는 것이 목표입니다. 목표선(20%) 이하 유지 필요.</div>
        </div>
        {latestDelta != null && (
          <div className={`trend-delta ${latestDelta < 0 ? 'good' : 'bad'}`}>
            {latestDelta < 0 ? '▼' : '▲'} {Math.abs(latestDelta).toFixed(1)}%p
            <span className="trend-delta-sub">직전 회차 대비</span>
          </div>
        )}
      </div>

      <div className="trend-wrap">
        <svg viewBox={`0 0 ${W} ${H}`} className="trend-svg" preserveAspectRatio="none">
          {/* horizontal grid + Y ticks */}
          {yTicks.map(t => (
            <g key={t}>
              <line x1={padL} y1={yAt(t)} x2={W - padR} y2={yAt(t)} className="trend-grid" />
              <text x={padL - 8} y={yAt(t) + 4} className="trend-ylabel">{t}%</text>
            </g>
          ))}

          {/* target line */}
          <line x1={padL} y1={yAt(target)} x2={W - padR} y2={yAt(target)} className="trend-target" />
          <text x={W - padR} y={yAt(target) - 6} className="trend-target-label" textAnchor="end">
            목표 {target}%
          </text>

          {/* area under actual */}
          {areaPath && <path d={areaPath} className="trend-area" />}
          {/* actual line */}
          {linePath && <path d={linePath} className="trend-line" />}
          {/* projected line */}
          {projPath && <path d={projPath} className="trend-line proj" />}

          {/* points */}
          {points.map((p, i) => {
            const cx = xAt(i);
            const isActual = p.v != null;
            const val = isActual ? p.v : p.target;
            if (val == null) return null;
            return (
              <g key={i}>
                <circle cx={cx} cy={yAt(val)} r={isActual ? 5 : 4}
                  className={`trend-dot ${isActual ? 'actual' : 'planned'}`} />
                <text x={cx} y={yAt(val) - 12} className={`trend-value ${isActual ? '' : 'planned'}`} textAnchor="middle">
                  {val.toFixed(1)}%
                </text>
                <text x={cx} y={H - padB + 16} className="trend-xlabel" textAnchor="middle">{p.label}</text>
                <text x={cx} y={H - padB + 30} className="trend-xdate" textAnchor="middle">{p.date}</text>
              </g>
            );
          })}
        </svg>
      </div>

      <div className="trend-legend">
        <span><span className="tl-swatch actual" /> 실측</span>
        <span><span className="tl-swatch planned" /> 목표(예정)</span>
        <span><span className="tl-swatch target" /> 관리 목표선</span>
      </div>
    </div>
  );
};

Object.assign(window, { PIChart, PITrend });

</script>

/* Confetti — pure CSS/SVG burst, plays once when all goals are Met. */
const ConfettiBurst = () => {
  const pieces = React.useMemo(() => {
    const colors = ['#F59E0B','#10B981','#2A6FDB','#EC4899','#8B5CF6','#EF4444','#22C55E','#F97316'];
    return Array.from({ length: 90 }, (_, i) => ({
      left: Math.random() * 100,
      delay: Math.random() * 0.6,
      duration: 2.6 + Math.random() * 1.6,
      rotate: Math.random() * 360,
      size: 6 + Math.random() * 8,
      color: colors[i % colors.length],
      shape: Math.random() > 0.5 ? 'square' : 'circle',
      drift: -30 + Math.random() * 60,
    }));
  }, []);
  return (
    <div className="confetti-overlay" aria-hidden>
      <div className="confetti-message">🎉 모든 목표 달성! 관리과정 완료를 축하합니다.</div>
      {pieces.map((p, i) => (
        <span key={i} className={`confetti-piece ${p.shape}`}
          style={{
            left: p.left + '%',
            width: p.size, height: p.size,
            background: p.color,
            animationDelay: p.delay + 's',
            animationDuration: p.duration + 's',
            '--drift': p.drift + 'vw',
            '--rot': p.rotate + 'deg',
          }} />
      ))}
    </div>
  );
};

<script type="text/babel">
/* Main App: layout + routing between sections */

const { useState, useEffect } = React;

const App = () => {
  const [current, setCurrent] = useState(() => localStorage.getItem('hy-step:current') || 'dashboard');
  const [photoOpen, setPhotoOpen] = useState(false);
  const [density, setDensity] = useState(() => localStorage.getItem('hy-step:density') || 'comfortable');
  const [patientEditOpen, setPatientEditOpen] = useState(false);

  const handleSave = React.useCallback(() => {
    const saved = { savedAt: new Date().toISOString(), section: current };
    localStorage.setItem('hy-step:save', JSON.stringify(saved));
    // Visual feedback
    const btn = document.querySelector('.btn.primary .save-label');
    if (btn) { btn.textContent = '저장됨 ✓'; setTimeout(() => { btn.textContent = '저장하기'; }, 2000); }
    alert('저장되었습니다. (로컬 스토리지에 보관)');
  }, [current]);

  useEffect(() => {
    localStorage.setItem('hy-step:current', current);
    // Scroll main area to top whenever section changes
    const el = document.querySelector('.main');
    if (el) el.scrollTop = 0;
  }, [current]);
  useEffect(() => {
    document.body.dataset.density = density;
    localStorage.setItem('hy-step:density', density);
  }, [density]);

  // Tweaks panel
  const [defaults] = useState({ density: 'comfortable' });
  useEffect(() => {
    const handler = (e) => {
      const d = e.data;
      if (!d) return;
      if (d.type === '__activate_edit_mode') window.__tweaksOpen = true;
      if (d.type === '__deactivate_edit_mode') window.__tweaksOpen = false;
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  React.useEffect(() => {
    window.__saveChart = handleSave;
    return () => { delete window.__saveChart; };
  }, [handleSave]);

  // Expose edit opener globally so PatientPanel can trigger without prop drilling
  React.useEffect(() => {
    window.__openPatientEdit = () => setPatientEditOpen(true);
    return () => { delete window.__openPatientEdit; };
  }, [setPatientEditOpen]);

  const renderPage = () => {
    const pageMap = {
      dashboard: <Dashboard onOpenSection={setCurrent} />,
      s1: <Section1 />,
      s2: <Section2 />,
      s3: <Section3 />,
      s4: <Section4 />,
      s5: <Section5 />,
      s6: <Section6 />,
      s7: <Section7 />,
      s8: <Section8 />,
      components: <ComponentsShowcase onOpenPhoto={() => setPhotoOpen(true)} />,
      photo: <PhotoPage onOpenPhoto={() => setPhotoOpen(true)} />,
    };
    return pageMap[current] || pageMap.dashboard;
  };

  return (
    <div className="app" data-screen-label={current}>
      <Sidebar current={current} onChange={setCurrent} />
      <Header current={current} onOpenPhoto={() => setPhotoOpen(true)} />
      <main className="main">
        <div className="main-inner">
          {renderPage()}
        </div>
      </main>

      <PhotoModal open={photoOpen} onClose={() => setPhotoOpen(false)} />
      <PatientEditModal open={patientEditOpen} onClose={() => setPatientEditOpen(false)} />

      {/* Density Tweak (accessible even without tweaks toolbar) */}
      <DensityFloater density={density} setDensity={setDensity} />
    </div>
  );
};

/* Simple always-visible density toggle in the bottom-right, styled subtly */
const DensityFloater = ({ density, setDensity }) => {
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20,
      background: '#fff', border: '1px solid var(--border)',
      borderRadius: 999, padding: 4,
      display: 'flex', gap: 2, alignItems: 'center',
      boxShadow: '0 8px 24px rgba(15,23,42,0.08)', zIndex: 50,
      fontSize: 12,
    }}>
      <span style={{ padding: '4px 10px', color: 'var(--ink-500)', fontSize: 11, fontWeight: 500 }}>Density</span>
      {[
        { k: 'compact', l: 'Compact' },
        { k: 'comfortable', l: 'Comfortable' },
      ].map(o => (
        <button key={o.k}
          onClick={() => setDensity(o.k)}
          style={{
            padding: '6px 14px', borderRadius: 999, border: 'none', cursor: 'pointer',
            background: density === o.k ? 'var(--primary)' : 'transparent',
            color: density === o.k ? '#fff' : 'var(--ink-600)',
            fontWeight: density === o.k ? 600 : 500, fontSize: 12,
          }}
        >{o.l}</button>
      ))}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
