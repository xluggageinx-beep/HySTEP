        <div className="combi-row-labels">
          <div className="row-label">BOP</div>
          <div className="row-label">PD Buccal</div>
          <div className="row-label big">상악</div>
          <div className="row-label">Mob / Sw</div>
          <div className="row-label">PD Lingual</div>
        </div>
        <div className="combi-cols">
          {TEETH_UPPER.map(upperColumn)}
        </div>
      </div>

      <div className="occlusal-line" />

      <div className="combi-grid">
        <div className="combi-row-labels">
          <div className="row-label">PD Lingual</div>
          <div className="row-label">Mob / Sw</div>
          <div className="row-label big">하악</div>
          <div className="row-label">PD Buccal</div>
          <div className="row-label">BOP</div>
        </div>
        <div className="combi-cols">
          {TEETH_LOWER.map(lowerColumn)}
        </div>
      </div>
    </div>
  );
};

/* ============ Calculus Chart — 6-cell per tooth (Buccal×3 / Lingual×3) ============ */
const CalculusChart = ({ modelState = HyStepToothModel.emptyState() }) => {
  // State: { toothNum: { buccal: [0/1,0/1,0/1], lingual: [0/1,0/1,0/1] } }
  const [calData, setCalData] = React.useState({});
  const toggleCal = (n, surface, i) => {
    setCalData(prev => {
      const t = prev[n] || { buccal:[0,0,0], lingual:[0,0,0] };
      const arr = [...(t[surface]||[0,0,0])];
      arr[i] = arr[i] ? 0 : 1;
      return { ...prev, [n]: { ...t, [surface]: arr } };
    });
  };

  const [calAmount, setCalAmount] = React.useState('');
  const [calLoc, setCalLoc] = React.useState('');
  const [calNote, setCalNote] = React.useState('');

  // A strip of 3 clickable cells
  const CalStrip3 = ({ n, surface }) => {
    const arr = (calData[n] && calData[n][surface]) || [0,0,0];
    const eligible = HyStepToothModel.isPeriodontalEligible(modelState, n);
    return (
      <div className="strip strip-pd-3" title={eligible?'':'해당 치아는 치주검사 대상에서 제외됩니다.'}
        style={{ cursor:eligible?'pointer':'not-allowed', pointerEvents:eligible?'auto':'none', opacity:eligible?1:.28 }}>
        {[0,1,2].map(i => (
          <div key={i} className="pd-cell" onClick={() => toggleCal(n, surface, i)}
            style={{ background: arr[i] ? '#DC2626' : undefined, minWidth:14 }}>
            {arr[i] ? <span style={{ color:'#fff', fontSize:10, fontWeight:700 }}>●</span>
                    : <span style={{ color:'var(--ink-300)', fontSize:10 }}>·</span>}
          </div>
        ))}
      </div>
    );
  };

  const renderUpperCol = (n) => {
    const cat = toothCategory(n);
    const eligible = HyStepToothModel.isPeriodontalEligible(modelState, n);
    const symbols = HyStepToothModel.displaySymbols(modelState, n);
    return (
      <div key={n} className="combi-col-new">
        <CalStrip3 n={n} surface="buccal" />
        <div className="tooth-slot upper">
          <div className="tooth-num-upper">{n}</div>
          <div className="tooth-body">
            <ToothIcon category={cat} missing={!eligible} />
            {symbols.length > 0 && <div style={{position:'absolute',inset:0}}><NotationOverlay code={symbols} isUpper={true} /></div>}
          </div>
        </div>
        <CalStrip3 n={n} surface="lingual" />
      </div>
    );
  };

  const renderLowerCol = (n) => {

    const eligible = HyStepToothModel.isPeriodontalEligible(modelState, n);

  return (
    <div>
      <div className="combined-chart-v2">
        <div className="combined-legend">
          <span><span style={{display:'inline-block',width:10,height:10,background:'#DC2626',borderRadius:'50%',marginRight:4}} /> 치석 있음 (클릭 토글)</span>

        </div>
        <div className="combi-grid">
          <div className="combi-row-labels">

          <div className="combi-cols">
            {TEETH_UPPER.map(renderUpperCol)}

        </div>
        <div className="occlusal-line" />
        <div className="combi-grid">
          <div className="combi-row-labels">
            <div className="row-label">Lingual</div>
            <div className="row-label big">하악</div>
            <div className="row-label">Buccal</div>

          <div className="combi-cols">
            {TEETH_LOWER.map(renderLowerCol)}

        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:10 }}>
          <div>
            <div style={{ fontSize:13, fontWeight:700 }}>치석 평가 (Calculus Assessment)</div>
            <div style={{ fontSize:11, color:'var(--ink-500)' }}>Calculus 수 / (활성 치아 × 6) × 100</div>
          </div>
          <div style={{ fontSize:24, fontWeight:700, color:'var(--primary)', fontVariantNumeric:'tabular-nums' }}>
            {rate.toFixed(2)}<span style={{ fontSize:14 }}>%</span>
          </div>
        </div>
        <div className="grid-2" style={{ gap:16 }}>
          <div>
            <label className="field-label">치석 양 (Calculus Amount)</label>
            <RadioGroup options={['Simple','Moderate','Heavy']} value={calAmount} onChange={setCalAmount} />
          </div>
          <div>

        <div style={{ marginTop:12 }}>
          <label className="field-label">치석 평가 소견 (Calculus Narrative)</label>
          <textarea className="textarea" style={{ minHeight:44 }}
            value={calNote} onChange={e=>setCalNote(e.target.value)} />
        </div>
      </div>
    </div>
  );
};


Object.assign(window, {
  ToothIcon, NotationChart, CombinedChart, CalculusChart,
  toothCategory, TEETH_UPPER, TEETH_LOWER
});

  <!-- 5. PI Chart -->
  <script type="text/babel">
/* PI Chart — X-shape 4 quadrants per tooth, big grid.
   Reference: last attached image with 상악(Maxilla) row and 하악(Mandible) row.
*/

const PIChart = ({ data = {}, modelState = HyStepToothModel.emptyState(), onToggle }) => {
  // data: { toothNum: [F, L, M, D] as 0/1 } — 4 quadrants per tooth
  const renderTooth = (n) => {
    const missing = !HyStepToothModel.isPiEligible(modelState, n);
    const arr = data[n] || [0, 0, 0, 0];
    const toggle = (i) => {
      if (missing) return;
      const next = [...arr]; next[i] = next[i] ? 0 : 1;
      onToggle && onToggle(n, next);
    };
    return (
      <div key={n} className={`pi-tooth ${missing ? 'disabled' : ''}`}
        title={missing ? '해당 치아는 PI 검사 대상에서 제외됩니다.' : ''}>
        <div className="n">{n}</div>
        <svg viewBox="0 0 40 40" className="pi-x">
          <rect x="1" y="1" width="38" height="38" />
          <line x1="1" y1="1" x2="39" y2="39" />
          <line x1="39" y1="1" x2="1" y2="39" />
          {/* Click regions (transparent) — reveal a red dot at that quadrant's centroid */}
          <path d="M 1,1 L 39,1 L 20,20 Z" className="quad-hit" onClick={() => toggle(0)} />
          <path d="M 1,39 L 39,39 L 20,20 Z" className="quad-hit" onClick={() => toggle(1)} />
          <path d="M 1,1 L 1,39 L 20,20 Z" className="quad-hit" onClick={() => toggle(2)} />
          <path d="M 39,1 L 39,39 L 20,20 Z" className="quad-hit" onClick={() => toggle(3)} />
          {/* Red dots at quadrant centroids */}
          {arr[0] ? <circle cx="20" cy="8"  r="3" className="pi-red-dot" /> : null}
          {arr[1] ? <circle cx="20" cy="32" r="3" className="pi-red-dot" /> : null}
          {arr[2] ? <circle cx="8"  cy="20" r="3" className="pi-red-dot" /> : null}
          {arr[3] ? <circle cx="32" cy="20" r="3" className="pi-red-dot" /> : null}
        </svg>
      </div>
    );
  };

  // Summary calcs
  const activeTeeth = [...TEETH_UPPER, ...TEETH_LOWER].filter(n => HyStepToothModel.isPiEligible(modelState, n));
  const totalSurfaces = activeTeeth.length * 4;
  let dotted = 0;
  activeTeeth.forEach(n => {
    const arr = data[n] || [0,0,0,0];
    arr.forEach(v => { if (v) dotted++; });
  });
  const oleary = totalSurfaces > 0 ? (dotted / totalSurfaces * 100) : 0;
  // Modified O'Leary — for demo, count only teeth where at least 1 surface is dotted
  const modDotted = activeTeeth.filter(n => (data[n] || []).some(v => v)).length;
  const modTotal = activeTeeth.length;
  const modOleary = modTotal > 0 ? (modDotted / modTotal * 100) : 0;

  return (
    <div>
      <div className="pi-chart">
        <div className="pi-arch-heading">상악 (Maxilla)</div>
        <div className="pi-row">
          {TEETH_UPPER.map(renderTooth)}
        </div>
        <div className="pi-arch-heading" style={{ marginTop: 18 }}>하악 (Mandible)</div>
        <div className="pi-row">
          {TEETH_LOWER.map(renderTooth)}
        </div>
      </div>

      <div className="pi-summary">
        <div className="item">
          <div className="l">착색 치면 수</div>
          <div className="v">{dotted}</div>
        </div>
        <div className="item">
          <div className="l">전체 치면 수</div>
          <div className="v">{totalSurfaces}</div>
        </div>
        <div className="item hero">
          <div className="l">O'Leary Index</div>
          <div className="v">{oleary.toFixed(2)}<span style={{ fontSize: 16 }}>%</span></div>
        </div>
        <div className="item mod">
          <div className="l">Modified O'Leary Index</div>
          <div className="v">{modOleary.toFixed(2)}<span style={{ fontSize: 16 }}>%</span></div>
        </div>
      </div>
    </div>
  );
};

/* Multi-visit trend — dual-row horizontal bar comparison + vertical target line + delta chip */
const PITrend = ({
  points = [
    { label: '1회차', v: 58.93, date: '07.06' },
    { label: '2회차', v: 24.10, date: '07.20' },
    { label: '3회차', v: null, date: '08.03', planned: true, target: 15 },
    { label: '4회차', v: null, date: '08.24', planned: true, target: 10 },
  ],
  target = 20,
}) => {
  const actual = points.filter(p => p.v != null);
  const maxVal = Math.max(target * 1.5, ...actual.map(p => p.v), 70);

  // Delta chip: latest vs previous visit
  const latestDelta = actual.length >= 2
    ? actual[actual.length-1].v - actual[actual.length-2].v : null;

  // Target line position (%)
  const targetPct = (target / maxVal) * 100;

  const BAR_COLORS = ['#3B82F6','#22C55E','#F59E0B','#8B5CF6'];

  return (
    <div className="card" style={{ margin:0 }}>
      <div className="card-head">
        <div>
          <div className="card-title">O\'Leary Index 회차별 비교</div>
          <div className="card-sub">막대 길이가 짧아질수록 치태 관리가 향상됨. 목표선({target}%) 이하 유지 목표.</div>
        </div>
        {latestDelta != null && (
          <div className={`trend-delta ${latestDelta < 0 ? 'good' : 'bad'}`}>
            {latestDelta < 0 ? '▼' : '▲'} {Math.abs(latestDelta).toFixed(1)}%p
            <span className="trend-delta-sub">직전 회차 대비</span>
          </div>
        )}
      </div>

      <div style={{ padding:'12px 16px', position:'relative' }}>
        {/* Column headers */}
        <div style={{ display:'flex', justifyContent:'space-between', fontSize:10, color:'var(--ink-400)', marginBottom:8, paddingLeft:56 }}>
          <span>0%</span>
          <span style={{marginLeft:'auto', color:'var(--danger)', fontWeight:600}}>목표 {target}%</span>
          <span style={{marginLeft:4}}>{Math.round(maxVal)}%</span>
        </div>

        {/* Bar rows */}
        {actual.map((p, i) => {
          const pct = (p.v / maxVal) * 100;
          const prevP = i > 0 ? actual[i-1] : null;
          const delta = prevP ? p.v - prevP.v : null;
          return (
            <div key={i} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
              {/* Label */}
              <div style={{ width:48, fontSize:11.5, fontWeight:700, color:'var(--ink-700)', flexShrink:0 }}>
                <div>{p.label}</div>
                <div style={{ fontSize:10, color:'var(--ink-400)', fontWeight:400 }}>{p.date}</div>
              </div>
              {/* Bar track */}
              <div style={{ flex:1, position:'relative', height:28 }}>
                {/* Bar */}
                <div style={{
                  position:'absolute', left:0, top:4, height:20,
                  width: `${pct}%`,
                  background: BAR_COLORS[i % BAR_COLORS.length],
                  borderRadius:'0 6px 6px 0',
                  transition:'width 0.5s ease',
                  opacity: 0.85,
                }}>
                  <span style={{
                    position:'absolute', right:6, top:'50%', transform:'translateY(-50%)',
                    fontSize:11, fontWeight:700, color:'#fff', whiteSpace:'nowrap',
                  }}>{p.v.toFixed(1)}%</span>
                </div>
                {/* Target vertical line */}
                <div style={{
                  position:'absolute', left:`${targetPct}%`, top:0, height:'100%',
                  width:2, background:'var(--danger)', opacity:0.7,
                  borderRadius:1,
                }} />
              </div>
              {/* Delta chip */}
              {delta !== null && (
                <div style={{
                  flexShrink:0, fontSize:11, fontWeight:700, padding:'3px 8px',
                  borderRadius:999, background: delta < 0 ? '#DCFCE7' : '#FEE2E2',
                  color: delta < 0 ? '#166534' : '#991B1B',
                }}>
                  {delta < 0 ? '▼' : '▲'}{Math.abs(delta).toFixed(1)}%p
                </div>
              )}
            </div>
          );
        })}

        {/* Planned future rows (ghost) */}
        {points.filter(p => p.v == null && p.target != null).map((p,i) => {
          const pct = (p.target / maxVal) * 100;
          return (
            <div key={'plan-'+i} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10, opacity:0.4 }}>
              <div style={{ width:48, fontSize:11.5, fontWeight:700, color:'var(--ink-500)', flexShrink:0 }}>
                <div>{p.label}</div>
                <div style={{ fontSize:10, color:'var(--ink-400)', fontWeight:400 }}>{p.date}</div>
              </div>
              <div style={{ flex:1, position:'relative', height:28 }}>
                <div style={{
                  position:'absolute', left:0, top:4, height:20,
                  width:`${pct}%`,
                  background:'#94A3B8',
                  borderRadius:'0 6px 6px 0',
                  border:'1px dashed #64748B',
                }}>
                  <span style={{ position:'absolute', right:6, top:'50%', transform:'translateY(-50%)', fontSize:11, fontWeight:600, color:'#475569' }}>{p.target}%</span>
                </div>
                <div style={{ position:'absolute', left:`${targetPct}%`, top:0, height:'100%', width:2, background:'var(--danger)', opacity:0.7, borderRadius:1 }} />
              </div>
              <div style={{ flexShrink:0, fontSize:11, color:'var(--ink-400)', padding:'3px 8px' }}>목표</div>
            </div>
          );
        })}
      </div>

      <div className="trend-legend">
        <span><span className="tl-swatch actual" /> 실측</span>
        <span><span style={{ display:'inline-block', width:10, height:2, background:'var(--danger)', marginRight:4, borderRadius:1 }} /> 관리 목표선 ({target}%)</span>
        <span><span className="tl-swatch planned" /> 예정 목표</span>
      </div>
    </div>
  );
};

Object.assign(window, { PIChart, PITrend });
  </script>

                {def.subs && (
                  <div style={{ marginBottom: 8 }}>
                    <label style={{ fontSize: 11, color: 'var(--ink-500)', marginBottom: 5, display: 'block', fontWeight: 600 }}>세부 병명</label>
                    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>

  <script type="text/babel">

/* ===== 사전문진 Page & Link Management ===== */
const PrescanLinkManager = ({ onOpenPrescan }) => {
  const [links, setLinks] = React.useState(() => {
    try { return JSON.parse(window.__chartStorage.getItem('hy-step:prescan-links') || '[]'); } catch { return []; }
  });
  const [copied, setCopied] = React.useState(null);

  const generateLink = () => {
    const id = 'A-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.random().toString(36).slice(2,8);
    const link = { id, url: `${location.origin}/prescan/${id}`, issued: new Date().toLocaleDateString('ko'), status: '미응답', expires: new Date(Date.now()+7*864e5).toLocaleDateString('ko') };
    const next = [...links, link];
    setLinks(next);
    window.__chartStorage.setItem('hy-step:prescan-links', JSON.stringify(next));
  };

  const expireLink = (id) => {
    const next = links.map(l => l.id === id ? {...l, status:'만료'} : l);
    setLinks(next);
    window.__chartStorage.setItem('hy-step:prescan-links', JSON.stringify(next));
  };

  const copyLink = (url, id) => {
    navigator.clipboard.writeText(url).catch(() => {});
    setCopied(id);
    setTimeout(() => setCopied(null), 2000);
  };

  const latestActive = links.filter(l => l.status !== '만료').slice(-1)[0];

  return (
    <div>
      {latestActive && (
        <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap',

const Section2 = () => {
  // Editable vitals
  const [glucose, setGlucose] = React.useState('');

  const [glucoseMenu, setGlucoseMenu] = React.useState('');
  const [glucoseElapsed, setGlucoseElapsed] = React.useState('');
  const [systolic, setSystolic] = React.useState('');
  const [diastolic, setDiastolic] = React.useState('');

  // Intraoral toggle chips
  const [intraoral, setIntraoral] = React.useState({
    'Face & Neck': [],
    'Lymph Nodes': [],
    'TMJ': [],
    'Oral Mucosa': [],
    'Palate': [],
    'Tongue': [],
    'Floor of Mouth': [],
    'Gingival characteristics': [],
  });

  const [chartTab, setChartTab] = React.useState('notation');
  const [toothModel, setToothModel] = React.useState(() =>
    HyStepToothModel.migrate(window.__hystepToothModelState || HyStepToothModel.emptyState()));
  const [selectedTeeth, setSelectedTeeth] = React.useState([]);
  const [activeNotation, setActiveNotation] = React.useState(null);
  const [toothMessage, setToothMessage] = React.useState('');
  const notationOptions = HyStepToothModel.registry.filter(item => item.selectable);

  React.useEffect(() => {
    window.__hystepToothModelState = toothModel;
    window.dispatchEvent(new CustomEvent('hystep-tooth-model-change', { detail: toothModel }));
  }, [toothModel]);
  React.useEffect(() => {
    const restore = event => {
      const raw = event.detail?.['tooth-model-state'];
      if (!raw) return;
      try { setToothModel(HyStepToothModel.migrate(JSON.parse(raw))); } catch (_) {}
    };
    window.addEventListener('hystep-section-restore', restore);
    return () => window.removeEventListener('hystep-section-restore', restore);
  }, []);

  const handleToothClick = tooth => {
    if (activeNotation && activeNotation.type !== 'bridge_action') {
      setToothModel(prev => HyStepToothModel.applyNotation(prev, tooth, activeNotation.id));
      setToothMessage(`${tooth}번 치아에 ${activeNotation.symbol} 적용`);
      return;
    }
    setSelectedTeeth(prev => prev.includes(tooth) ? prev.filter(item => item !== tooth) : [...prev, tooth]);
  };
  const createBridge = () => {
    const result = HyStepToothModel.createBridge(toothModel, selectedTeeth);
    setToothMessage(result.ok ? '브리지 관계를 생성했습니다.' : result.error);
    if (result.ok) { setToothModel(result.state); setSelectedTeeth([]); }
  };
  const toggleSpacing = () => {
    const result = HyStepToothModel.toggleInterdentalSpace(toothModel, selectedTeeth);
    setToothMessage(result.ok ? `치간 이개 V를 ${result.enabled ? '표시' : '제거'}했습니다.` : result.error);
    if (result.ok) { setToothModel(result.state); setSelectedTeeth([]); }
  };

  const intraoralItems = [
    { key: 'Face & Neck', ko: '얼굴 및 목', opts: ['Significant lesions', 'Nodules', 'Asymmetry'] },
    { key: 'Lymph Nodes', ko: '림프절', opts: ['Enlarged', 'Fixed', 'Indurated'] },
    { key: 'TMJ', ko: '악관절', opts: ['Limitations', 'Deviations', 'Discomfort', 'Audible', 'Palpable'] },
    { key: 'Oral Mucosa', ko: '구강 점막·치조제·입술', opts: ['Significant lesions', 'Ulcers', 'Discolorations', 'Nodules', 'Enlargements'] },
    { key: 'Palate', ko: '구개·구인두', opts: ['Significant lesions', 'Ulcers', 'Tori', 'Discolorations'] },
    { key: 'Tongue', ko: '혀', opts: ['Significant lesions', 'Ulcers', 'Discolorations', 'Nodules', 'Enlargements'] },
    { key: 'Floor of Mouth', ko: '구강저', opts: ['Significant lesions', 'Ulcers', 'Discolorations', 'Nodules', 'Enlargements'] },
    { key: 'Gingival characteristics', ko: '치은 특성', opts: ['Bleeding', 'Recession', 'Inflammation', 'Fibrous'] },
  ];

    { id: 's2-sub-1', label: '혈당·혈압 측정' },
    { id: 's2-sub-2', label: '구내 검사' },
    { id: 's2-sub-3', label: '치식 차팅' },
    { id: 's2-sub-4', label: '교수 요청/질문' },
  ];

  return (

          {/* 혈당 */}
          <div style={{ padding: 16, background: 'var(--surface-50)', border: '1px solid var(--border)', borderRadius: 10 }}>
            <div style={{ fontSize: 11.5, color: 'var(--ink-500)', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em' }}>혈당</div>

              <input type="number" className="vital-input" value={glucose} onChange={e => setGlucose(e.target.value)} aria-label="혈당 수치" />

                <input className="input" placeholder="식사 메뉴" value={glucoseMenu} onChange={e => setGlucoseMenu(e.target.value)} />

              </div>

/* ============= Section 6 — Intervention Record (Form1 + Form2) ============= */
const RichEditor = ({ id, placeholder, defaultVal }) => {
  const ref = React.useRef(null);
  const exec = (cmd, val) => { document.execCommand(cmd, false, val || null); ref.current && ref.current.focus(); };
  const insertHL = (cls) => {
    const sel = window.getSelection();
    if (sel && sel.rangeCount) {
      const range = sel.getRangeAt(0);
      const mark = document.createElement('mark');
      mark.className = cls;
      try { range.surroundContents(mark); } catch(e) { exec('insertHTML', `<mark class="${cls}">${sel.toString()}</mark>`); }
      sel.removeAllRanges();
    }
  };
  React.useEffect(() => {
    if (ref.current && defaultVal) ref.current.innerHTML = defaultVal;
  }, []);

  return (
    <div>
      <div className="rich-toolbar">
        <div className="grp">
          <button className="rt-btn b" title="굵게" onClick={()=>exec('bold')}><b>B</b></button>
          <button className="rt-btn i" title="기울기" onClick={()=>exec('italic')}><i>I</i></button>
          <button className="rt-btn u" title="밑줄" onClick={()=>exec('underline')}><u>U</u></button>
        </div>
        <div className="sep"/>
        <div className="grp" style={{gap:4}}>
          <span style={{fontSize:10.5, color:'var(--ink-500)', paddingRight:2}}>형광펜</span>
          {[['hl-y','#FEF3C7'],['hl-g','#D1FAE5'],['hl-b','#DBEAFE'],['hl-p','FCE7F3']].map(([cls,bg])=>(
            <button key={cls} className="rt-hl" style={{background:bg||('#'+cls.slice(3))}} title={cls} onClick={()=>insertHL(cls)} />
          ))}
        </div>
        <div className="sep"/>
        <div className="grp">
          <button className="rt-btn" title="글머리" onClick={()=>exec('insertUnorderedList')}>• 목록</button>
          <button className="rt-btn" title="번호목록" onClick={()=>exec('insertOrderedList')}>1. 목록</button>
        </div>
        <div className="sep"/>
        <div className="grp">
          <button className="rt-btn" title="실행취소" onClick={()=>exec('undo')}>↩</button>
          <button className="rt-btn" title="다시실행" onClick={()=>exec('redo')}>↪</button>
        </div>
      </div>
      <div id={id} ref={ref} className="rt-editor" contentEditable suppressContentEditableWarning
        style={{minHeight:200, outline:'none'}}
        data-placeholder={placeholder}
      />
    </div>
  );
};

/* ============= Section 8 — Follow-up ============= */
const Section8 = () => {
  const [followInterval, setFollowInterval] = React.useState('');
  const [statuses, setStatuses] = React.useState({});
  const goals = [
    '치은염 완화 및 잇몸 출혈 감소 (13-23 BOP 50% 감소)',
    '대구치 인접면 플라크 관리 (O\'Leary Index < 15%)',
  ];
  const setStatus = (i, v) => setStatuses(prev => ({ ...prev, [i]: v }));

  const allMet = goals.every((_, i) => statuses[i] === 'met');
  const [confetti, setConfetti] = React.useState(false);
  const prevAllMet = React.useRef(allMet);
  React.useEffect(() => {
    if (allMet && !prevAllMet.current) {
      setConfetti(true);
      setTimeout(() => setConfetti(false), 4500);
    }
    prevAllMet.current = allMet;
  }, [allMet]);

  const subsections = [
    { id: 's8-sub-1', label: '목표별 달성 평가' },
    { id: 's8-sub-2', label: '치위생관리과정 자가평가' },

                <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--primary)' }}>목표 {i + 1}</div>
                <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-900)', marginTop: 2 }}>{g}</div>
              </div>
              <div className="mpu">
                {['met', 'partial', 'unmet'].map(k => (
                  <button key={k}
                    className={`mpu-btn ${k} ${statuses[i] === k ? 'active' : ''}`}
                    onClick={() => setStatus(i, k)}

                  </button>
                ))}
              </div>
            </div>
            <textarea className="textarea" style={{ marginTop: 10, minHeight: 60 }}
              placeholder="달성 근거 및 관찰 내용" />
          </div>
        ))}

        <div style={{ marginTop: 14, padding: 16, background: 'var(--primary-50)', borderRadius: 10 }}>

      {confetti && <ConfettiBurst />}

};

/* Confetti — pure CSS/SVG burst, plays once when all goals are Met. */
const ConfettiBurst = () => {
  const pieces = React.useMemo(() => {
    const colors = ['#F59E0B','#10B981','#2A6FDB','#EC4899','#8B5CF6','#EF4444','#22C55E','#F97316'];
    return Array.from({ length: 90 }, (_, i) => ({
      left: Math.random() * 100,
      delay: Math.random() * 0.6,
      duration: 2.6 + Math.random() * 1.6,
      rotate: Math.random() * 360,
      size: 6 + Math.random() * 8,
      color: colors[i % colors.length],
      shape: Math.random() > 0.5 ? 'square' : 'circle',
      drift: -30 + Math.random() * 60,
    }));
  }, []);
  return (
    <div className="confetti-overlay" aria-hidden>
      <div className="confetti-message">🎉 모든 목표 달성! 관리과정 완료를 축하합니다.</div>
      {pieces.map((p, i) => (
        <span key={i} className={`confetti-piece ${p.shape}`}
          style={{
            left: p.left + '%',
            width: p.size, height: p.size,
            background: p.color,
            animationDelay: p.delay + 's',
            animationDuration: p.duration + 's',
            '--drift': p.drift + 'vw',
            '--rot': p.rotate + 'deg',
          }} />
      ))}
    </div>
  );
};

/* ============= Photo page (opens modal, shows preview under it too) ============= */
const PhotoPage = ({ onOpenPhoto }) => {

    <div>
      <div className="page-title">Photo 관리</div>
      <div className="page-sub">회차별·촬영법별 사진 세트를 관리합니다.</div>

        <div className="card-head">
          <div className="card-title">Photo 모달 미리보기</div>

        <div className="doc-hint" style={{ padding: 0, border: 'none' }}>
          모달을 열면 회차(1/2/3) · 촬영법(5매/6매) · 세트별 업로드 슬롯 UI를 확인할 수 있습니다.

};

Object.assign(window, { PhotoModal, ComponentsShowcase, PhotoPage });

  <!-- 12. Sidebar -->
  <script type="text/babel">
/* Sidebar — data-driven section list. Section index (1..N) is derived from array order
   so sections can be re-mixed later without hardcoded numbers.
   Sign status dots: 
     - green  = 서명 업로드 완료
     - white  = 서명 요청 전 (미업로드)
     - gray   = 서명 요청 후 · 대기 중
*/

const SECTIONS = [
  { id: 'dashboard', name: '대시보드',            en: 'Overview',                progress: 62, signStatus: null,     status: 'wip' },
  { id: 's1',        name: '초진 및 대상자 사정', en: 'Initial Interview',       progress: 100, signStatus: 'done',   status: 'done' },
  { id: 's2',        name: '임상 검사',           en: 'Clinical Examination',    progress: 85, signStatus: 'wip',   status: 'wip' },
  { id: 's3',        name: '구강위생 지수',       en: 'Oral Hygiene Index',      progress: 66, signStatus: 'wip',   status: 'wip' },
  { id: 's4',        name: '치위생 진단',         en: 'DH Diagnosis',            progress: 40, signStatus: 'empty', status: 'wip' },
  { id: 's5',        name: '치위생 계획',         en: 'DH Care Plan',            progress: 20, signStatus: 'empty', status: 'wip' },
  { id: 's6',        name: '수행 기록',           en: 'Intervention Record',     progress: 0,  signStatus: 'empty', status: 'empty' },
  { id: 's7',        name: '치위생 평가',         en: 'DH Evaluation',           progress: 0,  signStatus: 'empty', status: 'empty' },
  { id: 's8',        name: '추적 관리',           en: 'Follow-up',               progress: 0,  signStatus: 'empty', status: 'empty' },
].filter(s => s.id === 'dashboard' || (window.__ACTIVE_KEYS || []).includes(s.id));

const SignDot = ({ status }) => {
  // status aligned with review status machine:
  // 'empty' (gray outline) | 'wip' (blue) | 'review' (orange/yellow) | 'done' (green)
  // Legacy: 'signed' → 'done', 'pending' → 'review', 'unsent' → 'empty'
  const normalize = s => ({signed:'done', pending:'review', unsent:'empty'}[s] || s || 'empty');
  const ns = normalize(status);
  const map = {
    empty:  { title: '미작성' },
    wip:    { title: '작성 중' },
    review: { title: '서명 대기' },
    done:   { title: '서명 완료' },
  };
  if (!status) return <span className="sign-dot empty" />;
  return <span className={`sign-dot ${ns}`} title={map[ns]?.title} />;
};

const Sidebar = ({ current, onChange }) => {
  const sectionOnly = SECTIONS.filter(s => s.id !== 'dashboard');
  const overall = Math.round(sectionOnly.reduce((a, s) => a + s.progress, 0) / sectionOnly.length);

  const handleDownload = (format) => {
    // Full chart export: renders all sections sequentially into a print container
    if (format === 'pdf') {
      // Show all sections print-mode
      const style = document.createElement('style');
      style.id = 'print-all-style';
      style.textContent = `
        @media print {
          .sidebar, .app-header, .next-sec-btn, .main > .main-inner > div:not(.print-all-container) { display: none !important; }
          .print-all-container { display: block !important; }
          .print-section { page-break-after: always; page-break-inside: avoid; padding: 24px; }
          .print-section:last-child { page-break-after: auto; }
          @page { margin: 1.5cm; size: A4; }
        }
        .print-all-container { display: none; }
      `;
      document.head.appendChild(style);
      // Create print container with all sections
      const container = document.createElement('div');
      container.className = 'print-all-container';
      // Mount each section
      const sectionKeys = (window.SECTIONS || []).filter(s => s.id !== 'dashboard').map(s => s.id);
      container.innerHTML = `<div style="text-align:center;padding:32px;"><img src="/images/hystem-logo.png" style="height:48px" /><h1 style="margin-top:16px">Hy-STEP 치위생 차트</h1></div>`;
      sectionKeys.forEach(key => {
        const div = document.createElement('div');
        div.className = 'print-section';
        div.dataset.section = key;
        div.innerHTML = `<div id="print-${key}"></div>`;
        container.appendChild(div);
      });
      document.querySelector('.main-inner').appendChild(container);
      // Render sections into print container via React portals approach
      sectionKeys.forEach(key => {
        const el = document.getElementById(`print-${key}`);
        if (el && window.__sectionComponents && window.__sectionComponents[key]) {
          ReactDOM.createRoot(el).render(React.createElement(window.__sectionComponents[key]));
        }
      });
      setTimeout(() => {
        window.print();
        setTimeout(() => {
          container.remove();
          document.getElementById('print-all-style')?.remove();
        }, 1000);
      }, 600);
    } else {
      // HTML export: full page snapshot
      const html = '<!doctype html><html><meta charset="utf-8"><title>Hy-STEP Chart Export</title>' + document.documentElement.outerHTML + '</html>';
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'hy-step-chart.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  };

  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <img src="/images/hystem-logo.png" alt="Hy-STEP" />
      </div>

      <div className="mini-patient">
        <div className="row1">
          <span className="name">김민서</span>
          <span className="visit">2차 내원</span>
        </div>
        <div className="meta">여성 · 만 28세</div>
        <div className="progress-mini">
          <div className="label"><span>전체 진행률</span><b>{overall}%</b></div>
          <div className="bar"><span style={{ width: overall + '%' }} /></div>
        </div>
      </div>

      <nav className="nav-scroll">
        <div className="nav-heading">Chart Sections</div>
        {SECTIONS.map((s, i) => {
          const isSection = s.id !== 'dashboard';
          // Auto-derive display index from array position (dashboard skipped)
          const idxLabel = isSection ? String(sectionOnly.findIndex(x => x.id === s.id) + 1) : '';
          return (
            <button
              key={s.id}
              className={`nav-item ${current === s.id ? 'active' : ''}`}
              onClick={() => onChange(s.id)}
              title={isSection ? `Section ${idxLabel} · 교수 서명: ${s.signStatus === 'signed' ? '완료' : s.signStatus === 'pending' ? '대기' : '요청 전'}` : ''}
            >
              {isSection ? <SignDot status={s.signStatus} /> : <span className="sign-dot placeholder" />}
              <span className="idx">{idxLabel}</span>
              <span className="name">{s.name}</span>
              <span className="pct">{s.id === 'dashboard' ? '' : `${s.progress}%`}</span>
            </button>
          );
        })}

        {/* Download buttons */}
        <div className="nav-download">
          <div className="nav-download-l">차트 파일 다운로드</div>
          <div className="nav-download-row">
            <button className="btn sm" onClick={() => handleDownload('pdf')}>
              <Icon name="save" size={12} /> PDF
            </button>
            <button className="btn sm" onClick={() => handleDownload('html')}>
              <Icon name="save" size={12} /> HTML
            </button>
          </div>

        </div>


        <div className="nav-heading" style={{ marginTop: 12 }}>Design System</div>
        <button className={`nav-item ${current === 'components' ? 'active' : ''}`} onClick={() => onChange('components')}>
          <span className="sign-dot placeholder" />
          <span className="idx"></span>
          <span className="name">공용 컴포넌트</span>
          <span className="pct"></span>
        </button>
        <button className={`nav-item ${current === 'photo' ? 'active' : ''}`} onClick={() => onChange('photo')}>
          <span className="sign-dot placeholder" />
          <span className="idx"></span>
          <span className="name">Photo 모달</span>
          <span className="pct"></span>
        </button>
      </nav>

      <div className="sidebar-footer">
        <div className="avatar">JM</div>
        <div className="who">
          <b>이지민</b>
          <span>2023560031</span>
        </div>
      </div>
    </aside>
  );
};

Object.assign(window, { Sidebar, SECTIONS, SignDot });

  </script>

  <!-- 13. App -->
  <script type="text/babel">
/* Main App: layout + routing between sections */

const { useState, useEffect } = React;

const App = () => {
  const [current, setCurrent] = useState(() => {
    const saved = window.__chartStorage.getItem('hy-step:current') || 'dashboard';
    const allowed = ['dashboard', ...(window.__ACTIVE_KEYS || [])];
    return allowed.includes(saved) ? saved : ((window.__ACTIVE_KEYS || [])[0] || 'dashboard');
  });
  const [photoOpen, setPhotoOpen] = useState(false);
  useEffect(() => {
    window.__chartStorage.setItem('hy-step:current', current);
    // Fix #17: Scroll main area to top whenever section changes
    const el = document.querySelector('.main');
    if (el) el.scrollTop = 0;
  }, [current]);

  // Fix #31: Tab key to cycle sections
  useEffect(() => {
    const allKeys = ['dashboard', ...(window.SECTIONS || []).filter(s=>s.id!=='dashboard').map(s=>s.id)];
    const handler = (e) => {
      // Only handle Tab when not in input/textarea
      if (e.key !== 'Tab' || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
      if (document.activeElement?.contentEditable === 'true') return;
      e.preventDefault();
      setCurrent(prev => {
        const idx = allKeys.indexOf(prev);
        const next = e.shiftKey
          ? allKeys[(idx - 1 + allKeys.length) % allKeys.length]
          : allKeys[(idx + 1) % allKeys.length];
        return next;
      });
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  // Fix #18: Auto-save — any storage update persists
  useEffect(() => {
    const handler = () => {
      const saved = window.__chartStorage.getItem('hy-step:save');
      if (!saved) window.__chartStorage.setItem('hy-step:save', new Date().toISOString());
    };
    window.addEventListener('hy-step-change', handler);
    return () => window.removeEventListener('hy-step-change', handler);
  }, []);

  const [defaults] = useState({});
  useEffect(() => {
    const handler = (e) => {
      const d = e.data;
      if (!d) return;
      if (d.type === '__activate_edit_mode') window.__tweaksOpen = true;
      if (d.type === '__deactivate_edit_mode') window.__tweaksOpen = false;
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const renderPage = () => {
    const pageMap = {
      dashboard: <Dashboard onOpenSection={setCurrent} />,
      s1: <Section1 />,
      s2: <Section2 />,
      s3: <Section3 />,
      s4: <Section4 />,
      s5: <Section5 />,
      s6: <Section6 />,
      s7: <Section7 />,
      s8: <Section8 />,
      components: <ComponentsShowcase onOpenPhoto={() => setPhotoOpen(true)} />,
      photo: <PhotoPage onOpenPhoto={() => setPhotoOpen(true)} />,
    };
    return pageMap[current] || pageMap.dashboard;
  };

  return (
    <div className="app" data-screen-label={current}>
      <Sidebar current={current} onChange={setCurrent} />
      <Header current={current} onOpenPhoto={() => setPhotoOpen(true)} />
      <main className="main">
        <div className="main-inner">
          {renderPage()}
        </div>
      </main>

      <PhotoModal open={photoOpen} onClose={() => setPhotoOpen(false)} />

      {/* Fix #31: Next section triangle button */}
      <NextSectionButton current={current} onChange={setCurrent} />

    </div>
  );
};



/* Fix #31: Next section floating button */
const NextSectionButton = ({ current, onChange }) => {
  const allKeys = ['dashboard', ...(window.SECTIONS||[]).filter(s=>s.id!=='dashboard').map(s=>s.id)];
  const idx = allKeys.indexOf(current);
  const nextKey = allKeys[(idx + 1) % allKeys.length];
  const nextSection = (window.SECTIONS||[]).find(s=>s.id===nextKey);
  const nextName = nextKey === 'dashboard' ? '대시보드' : nextSection?.name || nextKey;
  return (
    <button
      onClick={() => onChange(nextKey)}
      title={`다음: ${nextName}`}
      style={{
        position: 'fixed', bottom: 24, right: 24,
        width: 48, height: 48,
        background: 'var(--primary)',
        border: 'none', borderRadius: 12,
        cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        boxShadow: '0 4px 16px rgba(42,111,219,0.35)',
        zIndex: 100,
        transition: 'transform 0.15s',
      }}
      onMouseEnter={e=>e.currentTarget.style.transform='scale(1.08)'}
      onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M 2,5 L 9,13 L 16,5 Z" fill="white"/>
      </svg>
    </button>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>

  <!-- 14. Post-init: wire section components for print export -->
  <script type="text/babel">
  (function() {
    window.__sectionComponents = {
      s1: window.Section1,
      s2: window.Section2,
      s3: window.Section3,
      s4: window.Section4,
      s5: window.Section5,
      s6: window.Section6,
      s7: window.Section7,
      s8: window.Section8,
    };
    // Override SECTIONS based on active keys from config
    const ALL_SECTIONS_MAP = {};
    (window.SECTIONS || []).forEach(s => { ALL_SECTIONS_MAP[s.id] = s; });
    const filteredSections = ['dashboard', ...(window.__ACTIVE_KEYS || [])].map(k => ALL_SECTIONS_MAP[k]).filter(Boolean);
    if (filteredSections.length && filteredSections.length !== (window.SECTIONS||[]).length) {
      Object.defineProperty(window, 'SECTIONS', { get: () => filteredSections, configurable: true });
    }
  })();
  </script>
<!-- v4 Prototype integration: existing chart body preserved -->
<script src="/prototype-store.js"></script><script src="/chart-integration.js"></script>
</body>
