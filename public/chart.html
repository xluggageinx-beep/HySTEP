<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Hy-STEP · 치위생 전자 차트</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
/* ============ Hy-STEP Chart — Design System Styles ============ */
:root {
  --primary: #2A6FDB;
  --primary-600: #2360C4;
  --primary-50: #EEF4FE;
  --primary-100: #D9E6FB;

  --ink-900: #0F172A;
  --ink-700: #334155;
  --ink-600: #475569;
  --ink-500: #64748B;
  --ink-400: #94A3B8;
  --ink-300: #CBD5E1;

  --surface: #FFFFFF;
  --surface-50: #F8FAFC;
  --surface-100: #F1F5F9;
  --border: #E5E9F0;
  --border-strong: #D6DCE5;

  --ok: #10B981;
  --ok-50: #ECFDF5;
  --warn: #F59E0B;
  --warn-50: #FFFBEB;
  --danger: #EF4444;
  --danger-50: #FEF2F2;
  --info: #6366F1;
  --info-50: #EEF2FF;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;

  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15,23,42,0.04);

  --sidebar-w: 264px;
  --header-h: 64px;

  /* density */
  --pad-card: 24px;
  --pad-section: 32px;
  --gap-card: 20px;
  --font-scale: 1;
}

[data-density="compact"] {
  --pad-card: 16px;
  --pad-section: 20px;
  --gap-card: 12px;
  --font-scale: 0.94;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink-900);
  background: var(--surface-50);
  font-size: calc(14px * var(--font-scale));
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* ============ Layout Shell ============ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  min-height: 100vh;
}

/* ---- Sidebar ---- */
.sidebar {
  grid-row: 1 / 3;
  grid-column: 1;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: sticky;
  top: 0;
  height: 100vh;
}
.sidebar-brand {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-brand img {
  height: 34px;
  width: auto;
  display: block;
}
.sidebar-brand .brand-sub {
  font-size: 10.5px;
  color: var(--ink-400);
  letter-spacing: 0.02em;
  margin-top: 2px;
}

.mini-patient {
  padding: 14px 16px;
  margin: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, #FBFCFE 0%, #F5F8FD 100%);
}
.mini-patient .row1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}
.mini-patient .name {
  font-weight: 700;
  font-size: 15px;
  color: var(--ink-900);
}
.mini-patient .visit {
  font-size: 11px;
  color: var(--primary);
  background: var(--primary-50);
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
.mini-patient .row1 .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mini-patient .meta {
  font-size: 11.5px;
  color: var(--ink-500);
  margin-top: 4px;
}

.progress-mini {
  margin-top: 10px;
}
.progress-mini .label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-500);
  margin-bottom: 4px;
}
.progress-mini .label b { color: var(--ink-900); font-weight: 600; }
.bar {
  height: 4px;
  border-radius: 999px;
  background: var(--surface-100);
  overflow: hidden;
}
.bar > span {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: 999px;
}

.nav-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px 20px;
}
.nav-heading {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-400);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 12px 12px 6px;
}
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--ink-700);
  font-size: 13.5px;
  text-align: left;
  transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: var(--surface-100); }
.nav-item.active {
  background: var(--primary-50);
  color: var(--primary);
  font-weight: 600;
}
.nav-item .idx {
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  color: var(--ink-400);
  width: 18px;
}
.nav-item.active .idx { color: var(--primary); }
.nav-item .name { flex: 1; }
.nav-item .pct {
  font-size: 11px;
  color: var(--ink-400);
  font-variant-numeric: tabular-nums;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--ink-300);
}
.status-dot.done  { background: var(--ok); }
.status-dot.wip   { background: var(--warn); }
.status-dot.empty { background: var(--ink-300); }
.status-dot.review { background: var(--info); }

/* ============ Sign-status Dot (교수 서명 상태) ============ */
.sign-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid transparent;
  box-sizing: border-box;
}
.sign-dot.signed {
  background: var(--ok);
  border-color: var(--ok);
}
.sign-dot.pending {
  background: #94A3B8;
  border-color: #94A3B8;
}
.sign-dot.unsent {
  background: #fff;
  border-color: var(--ink-300);
}
.sign-dot.placeholder {
  background: transparent;
  border-color: transparent;
}

/* Sign-status mini legend inside sidebar */
.sign-legend {
  margin: 12px 12px 4px;
  padding: 10px 12px;
  background: var(--surface-50);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.sign-legend .sl-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-500);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.sign-legend .sl-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--ink-600);
  padding: 3px 0;
}

/* Download buttons block */
.nav-download {
  margin: 14px 12px 4px;
  padding: 12px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: linear-gradient(180deg, #FBFCFE, #F5F8FD);
}
.nav-download-l {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-700);
  margin-bottom: 8px;
}
.nav-download-row {
  display: flex; gap: 6px;
}
.nav-download-row .btn {
  flex: 1; justify-content: center;
}
.nav-download-hint {
  font-size: 10px;
  color: var(--ink-400);
  margin-top: 8px;
  line-height: 1.4;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2A6FDB, #6366F1);
  color: #fff;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
}
.sidebar-footer .who { font-size: 12.5px; }
.sidebar-footer .who b { display: block; color: var(--ink-900); font-weight: 600; }
.sidebar-footer .who span { color: var(--ink-400); font-size: 11px; white-space: nowrap; }

/* ---- Header ---- */
.header {
  grid-column: 2;
  grid-row: 1;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--ink-500);
  flex-wrap: nowrap;
  min-width: 0;
  overflow: hidden;
}
.crumbs > span { white-space: nowrap; }
.crumbs .sep { color: var(--ink-300); }
.crumbs .current { color: var(--ink-900); font-weight: 600; }
.crumbs .time {
  margin-left: 10px;
  color: var(--primary);
  background: var(--primary-50);
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}
.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-700);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.12s;
}
.btn:hover { background: var(--surface-100); }
.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn.primary:hover { background: var(--primary-600); }
.btn.ghost {
  border-color: transparent;
  background: transparent;
  color: var(--ink-600);
}
.btn.ghost:hover { background: var(--surface-100); }
.btn.icon { padding: 8px; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.photo {
  background: #E7F7EE;
  border-color: #B7EBCB;
  color: #067A46;
}
.btn.photo:hover { background: #D6F0DE; }

/* ---- Main ---- */
.main {
  grid-column: 2;
  grid-row: 2;
  overflow-y: auto;
}
.main-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--pad-section) 40px 80px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink-900);
  margin: 0 0 4px;
  letter-spacing: -0.01em;
}
.page-sub {
  color: var(--ink-500);
  font-size: 13.5px;
  margin: 0 0 24px;
}

/* ============ Cards ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--pad-card);
  box-shadow: var(--shadow-xs);
}
.card + .card { margin-top: var(--gap-card); }
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink-900);
  letter-spacing: -0.005em;
  margin: 0;
}
.card-sub {
  font-size: 12px;
  color: var(--ink-500);
  margin-top: 2px;
}
.card-eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

/* ============ Patient Info Panel ============ */
.patient-panel {
  background: linear-gradient(135deg, #F7FAFE 0%, #FFFFFF 60%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  margin-bottom: 24px;
  position: relative;
}
.patient-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.patient-head .p-avatar {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2A6FDB, #6366F1);
  color: #fff;
  display: grid; place-items: center;
  font-size: 18px; font-weight: 700;
}
.patient-head .p-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.patient-head .p-tags {
  display: flex; gap: 6px; margin-top: 4px;
}
.tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-100);
  color: var(--ink-600);
  font-weight: 500;
}
.tag.blue { background: var(--primary-50); color: var(--primary); }
.tag.green { background: var(--ok-50); color: var(--ok); }
.tag.warn { background: var(--warn-50); color: #B45309; }

.patient-edit {
  position: absolute; top: 18px; right: 18px;
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.6);
  color: var(--ink-500);
  display: grid; place-items: center;
  transition: all 0.15s;
}
.patient-edit:hover { background: #fff; color: var(--primary); }

.info-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px 32px;
}
.info-grid .cell .l {
  font-size: 11px;
  color: var(--ink-400);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
  font-weight: 500;
}
.info-grid .cell .v {
  font-size: 14px;
  color: var(--ink-900);
  font-weight: 600;
}
.info-grid .cell .v .sub {
  color: var(--ink-500);
  font-weight: 400;
  margin-left: 4px;
  font-size: 12px;
}
.info-grid.locked .cell.locked .l::after {
  content: '🔒';
  margin-left: 4px;
  font-size: 9px;
  opacity: 0.5;
}

/* Systemic strip — dashboard banner replacing O'Leary KPI */
.systemic-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 16px 22px;
  background: linear-gradient(90deg, #FEF2F2 0%, #FFFFFF 60%);
  border: 1px solid #FDE2E2;
  border-left: 3px solid var(--danger);
  border-radius: var(--radius);
  margin-bottom: 4px;
}
.systemic-strip.clean {
  background: var(--surface);
  border-color: var(--border);
  border-left-color: var(--ink-300);
}
.systemic-strip .ss-eyebrow {
  font-size: 11px; font-weight: 600;
  color: var(--ink-500);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.systemic-strip .ss-title {
  font-size: 20px; font-weight: 700; letter-spacing: -0.01em;
  color: var(--ink-900);
  display: flex; align-items: baseline; gap: 6px;
  flex-wrap: wrap;
}
.systemic-strip .ss-title .disease { white-space: nowrap; }
.systemic-strip .ss-title .disease { color: var(--danger); }
.systemic-strip .ss-title .disease.none { color: var(--ink-900); font-weight: 500; }
.systemic-strip .ss-title .sep { color: var(--ink-400); font-weight: 500; margin-right: 4px; }
.systemic-strip .ss-r {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
}
.systemic-strip .ss-hint { font-size: 12px; color: var(--ink-500); }

/* Compact pre-consultation box */
.pre-consult-compact {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 16px;
  background: var(--surface-50);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.pre-consult-compact .pcc-fields {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 16px;
  min-width: 0;
}
.pre-consult-compact .pcc-fields > div { min-width: 0; }
.pre-consult-compact .pcc-l {
  font-size: 10.5px; color: var(--ink-500); text-transform: uppercase;
  letter-spacing: 0.06em; font-weight: 600; margin-bottom: 3px;
}
.pre-consult-compact .pcc-v {
  font-size: 12px; color: var(--ink-900); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pre-consult-compact .pcc-v.link {
  font-family: ui-monospace, monospace;
  color: var(--primary); font-size: 11.5px;
}
.pre-consult-compact .pcc-v.ok { color: var(--ok); font-weight: 600; }
.pre-consult-compact .pcc-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ============ Overview grid (dashboard) ============ */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap-card);
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.kpi .l { font-size: 11.5px; color: var(--ink-500); }
.kpi .v { font-size: 24px; font-weight: 700; color: var(--ink-900); margin-top: 4px; letter-spacing: -0.02em; }
.kpi.systemic .v { font-size: 20px; line-height: 1.25; }
.kpi.systemic.warn { background: linear-gradient(180deg, #FEF7F7 0%, #FFFFFF 100%); border-color: #FBD5D5; }
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--ink-400); margin-left: 4px; }
.kpi .delta { font-size: 11.5px; margin-top: 4px; color: var(--ok); }
.kpi.warn .delta { color: var(--warn); }

.section-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap-card);
  margin-top: var(--gap-card);
}
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.section-card:hover {
  border-color: var(--primary-100);
  box-shadow: 0 4px 12px rgba(42, 111, 219, 0.06);
  transform: translateY(-1px);
}
.section-card .sc-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 8px;
}
.section-card .sc-head > div:first-child { min-width: 0; flex: 1; }
.section-card .sc-idx {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-400);
  letter-spacing: 0.06em;
}
.section-card .sc-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-900);
  margin-top: 2px;
}
.section-card .sc-en {
  font-size: 11.5px;
  color: var(--ink-400);
  font-style: italic;
  margin-top: 2px;
}
.sc-status-pill {
  font-size: 10.5px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap;
  flex-shrink: 0;
}
.sc-status-pill.done   { background: var(--ok-50); color: #047857; }
.sc-status-pill.wip    { background: var(--warn-50); color: #B45309; }
.sc-status-pill.empty  { background: var(--surface-100); color: var(--ink-500); }
.sc-status-pill.review { background: var(--info-50); color: #4338CA; }
.sc-progress { margin-top: auto; }
.sc-progress .row {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--ink-500); margin-bottom: 5px;
}
.sc-progress .row b { color: var(--ink-900); font-weight: 600; }

/* ============ Section Doc styles ============ */
.doc-lead {
  padding: 14px 16px;
  border-left: 3px solid var(--primary);
  background: var(--primary-50);
  border-radius: 0 8px 8px 0;
  color: var(--ink-700);
  font-size: 13px;
  margin-bottom: 22px;
}
.doc-lead b { color: var(--primary); }

.doc-h {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 28px 0 10px;
}
.doc-hint {
  font-size: 11.5px;
  color: var(--ink-400);
  margin-top: 6px;
}

/* ============ Form controls ============ */
.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-700);
  margin-bottom: 6px;
  display: block;
}
.field-label .req { color: var(--danger); margin-left: 2px; }

/* Editable large number for vitals (BP / glucose) */
.vital-input {
  font-size: 34px;
  font-weight: 700;
  color: var(--ink-900);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  background: transparent;
  border: none;
  border-bottom: 1.5px dashed transparent;
  padding: 0 2px 2px;
  width: 76px;
  text-align: left;
  outline: none;
  font-family: inherit;
  -moz-appearance: textfield;
  transition: border-color 0.12s, background 0.12s;
}
.vital-input::-webkit-outer-spin-button,
.vital-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.vital-input:hover { border-bottom-color: var(--ink-300); }
.vital-input:focus {
  border-bottom-color: var(--primary);
  background: rgba(42, 111, 219, 0.04);
  border-radius: 4px 4px 0 0;
}

.input, .textarea, .select {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink-900);
  font-size: 13px;
  transition: all 0.12s;
  outline: none;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(42, 111, 219, 0.12);
}
.textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--ink-400); }

/* Radio & Checkbox group */
.radio-group, .check-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.radio-chip, .check-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-700);
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
}
.radio-chip:hover, .check-chip:hover { background: var(--surface-100); }
.radio-chip.active, .check-chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  font-weight: 600;
}
.radio-chip .dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 1.5px solid var(--ink-300);
  display: inline-grid; place-items: center;
}
.radio-chip.active .dot { border-color: #fff; }
.radio-chip.active .dot::after {
  content: ''; width: 5px; height: 5px; background: #fff; border-radius: 50%;
}
.check-chip .box {
  width: 12px; height: 12px; border-radius: 3px;
  border: 1.5px solid var(--ink-300);
}
.check-chip.active .box {
  background: #fff; border-color: #fff;
  position: relative;
}
.check-chip.active .box::after {
  content: '✓'; position: absolute;
  inset: 0; color: var(--primary);
  font-size: 10px; font-weight: 900;
  display: grid; place-items: center;
  line-height: 1;
}

/* Scale (Dental Anxiety) */
.scale-row {
  display: grid;
  grid-template-columns: 220px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.scale-row:last-child { border-bottom: none; }
.scale-row .q { font-size: 13px; color: var(--ink-700); }
.scale-opts {
  display: flex;
  gap: 4px;
}
.scale-opt {
  flex: 1;
  padding: 8px 4px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  background: var(--surface);
  font-size: 11px;
  color: var(--ink-500);
  text-align: center;
  cursor: pointer;
  transition: all 0.1s;
}
.scale-opt:hover { border-color: var(--primary); color: var(--primary); }
.scale-opt.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  font-weight: 600;
}
.scale-total {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  padding: 4px 12px;
  background: var(--primary-50);
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  text-align: center;
}

/* ============ Table ============ */
.table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12.5px;
}
.table th {
  text-align: left;
  padding: 10px 12px;
  background: var(--surface-50);
  color: var(--ink-500);
  font-weight: 600;
  font-size: 11.5px;
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.table td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-700);
  vertical-align: middle;
}
.table tbody tr.disabled { color: var(--ink-400); background: #FBFCFD; }
.table tbody tr.disabled td { color: var(--ink-400); }
.table .col-check {
  width: 40px; text-align: center;
}

/* checkbox atom */
.chk {
  width: 16px; height: 16px;
  border: 1.5px solid var(--ink-300);
  border-radius: 4px;
  display: inline-grid; place-items: center;
  cursor: pointer;
  background: #fff;
  transition: all 0.12s;
}
.chk:hover { border-color: var(--primary); }
.chk.on {
  background: var(--primary); border-color: var(--primary);
}
.chk.on::after {
  content: '✓'; color: #fff; font-size: 11px; font-weight: 800; line-height: 1;
}

/* ============ Toggle chip card (intraoral) ============ */
.toggle-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  background: var(--surface-50);
}
.toggle-card .tc-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-900);
  margin-bottom: 4px;
}
.toggle-card .tc-en {
  font-size: 11px;
  color: var(--ink-400);
  font-style: italic;
  margin-bottom: 10px;
}
.toggle-chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 10px;
}
.toggle-chips .chip {
  padding: 5px 10px;
  border-radius: 6px;
  background: #fff;
  border: 1px solid var(--border-strong);
  font-size: 11.5px;
  color: var(--ink-600);
  cursor: pointer;
  transition: all 0.1s;
}
.toggle-chips .chip:hover { border-color: var(--primary); color: var(--primary); }
.toggle-chips .chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  font-weight: 600;
}

/* ============ New Tooth Chart (2-row grid layout) ============ */
.tooth-chart-new {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 16px;
}
.tooth-row {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 4px;
}
.occlusal-line {
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--primary) 15%, var(--primary) 85%, transparent 100%);
  border-radius: 3px;
  margin: 10px 0;
  opacity: 0.5;
}
.tooth-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 4px 2px;
  border-radius: 6px;
  transition: background 0.12s;
}
.tooth-cell:not(.no-hover):hover { background: var(--surface-50); }
.tooth-cell .tooth-num {
  font-size: 11px;
  color: var(--ink-500);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.tooth-cell .tooth-body {
  position: relative;
  width: 100%;
  aspect-ratio: 40/52;
  max-width: 42px;
}

/* Combined chart (PD/BOP/Mob/SW) */
.combined-chart {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 14px;
  overflow-x: auto;
}
.combined-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 8px 4px 14px;
  font-size: 11.5px;
  color: var(--ink-600);
  border-bottom: 1px dashed var(--border);
  margin-bottom: 10px;
}
.combined-legend > span {
  display: inline-flex; align-items: center; gap: 5px;
}
.combi-row {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 3px;
  min-width: 780px;
}
.combi-col {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
}
.strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  height: 18px;
}
.strip .cell {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 2px;
  display: grid; place-items: center;
  font-size: 9.5px;
  color: var(--ink-500);
  min-height: 16px;
}
.strip.strip-bop .cell { background: #FBFBFC; }
.strip .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #DC2626;
}
.pd-num {
  color: var(--ink-700);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-size: 10px;
}
.pd-num.warn { color: #DC2626; }
.mob-sw {
  display: flex; gap: 3px; justify-content: center;
  min-height: 16px;
}
.mob-sw.top { min-height: 16px; }
.badge-mob, .badge-sw {
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: 0.02em;
}
.badge-mob { background: #FEE2E2; color: #B91C1C; }
.badge-sw  { background: #FEF3C7; color: #92400E; }

.cal-strip { display: grid; place-items: center; height: 26px; }
.combined-legend .bop-dot {
  width: 6px; height: 6px; border-radius: 50%; background: #DC2626;
}

/* Chart tabs — bigger, matches reference */
.chart-tabs {
  display: flex; gap: 6px; margin-bottom: 12px;
}
.chart-tab {
  flex: 1;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-600);
  cursor: pointer;
  transition: all 0.12s;
}
.chart-tab:hover { background: var(--surface-50); }
.chart-tab.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.chart-tabs.round { max-width: 480px; }

/* ============ Notation grid — legend chips at top of chart ============ */
.notation-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 14px;
}
.notation-chip {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 11.5px;
  color: var(--ink-700);
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.notation-chip:hover { border-color: var(--primary); }
.notation-chip.selected { background: var(--primary-50); border-color: var(--primary); }
.notation-chip .code { font-weight: 700; color: var(--ink-900); font-size: 12px; }
.notation-chip .desc { font-size: 10.5px; color: var(--ink-500); }

/* Legacy tooth diagram — keep but marked deprecated */
.tooth-chart {
  background: #FFFBEA;
  border: 1px solid #F5E7B4;
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  position: relative;
}
.tooth-chart .arch-label {
  position: absolute;
  left: 20px;
  font-size: 10.5px;
  font-weight: 600;
  color: #92400E;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.tooth-chart .arch-label.maxilla { top: 24px; }
.tooth-chart .arch-label.mandible { bottom: 24px; }
.tooth-svg {
  display: block;
  margin: 0 auto;
  max-width: 720px;
  width: 100%;
  height: auto;
}
.tooth-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 16px;
  font-size: 11.5px;
  color: var(--ink-600);
}
.tooth-legend .item {
  display: inline-flex; align-items: center; gap: 5px;
}
.tooth-legend .swatch {
  width: 10px; height: 10px; border-radius: 3px;
  border: 1px solid var(--border-strong);
}

/* ============ PI Chart — big X grid ============ */
.pi-chart {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
}
.pi-arch-heading {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-700);
  margin: 6px 0 8px;
  letter-spacing: 0.02em;
}
.pi-row {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 4px;
  align-items: start;
}
.pi-tooth {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  min-width: 0;
}
.pi-tooth .n {
  font-size: 11px;
  color: var(--ink-500);
  font-variant-numeric: tabular-nums;
}
.pi-x {
  width: 100%;
  max-width: 60px;
  height: auto;
  aspect-ratio: 1 / 1;
  cursor: pointer;
  display: block;
}
.pi-x rect { fill: #fff; stroke: #D6DCE5; }
.pi-x line { stroke: #D6DCE5; stroke-width: 1; }
.pi-x .quad { fill: transparent; transition: fill 0.12s; cursor: pointer; }
.pi-x .quad.on { fill: #DC2626; }
.pi-tooth.disabled .pi-x rect { fill: #F8FAFC; }
.pi-tooth.disabled .pi-x line { stroke: #94A3B8; }
.pi-tooth.disabled { opacity: 0.55; pointer-events: none; }

.pi-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-top: 20px;
  padding: 16px;
  background: var(--primary-50);
  border-radius: 12px;
}
.pi-summary .item {
  text-align: center;
}
.pi-summary .l {
  font-size: 11.5px;
  color: var(--ink-500);
  margin-bottom: 6px;
  font-weight: 500;
}
.pi-summary .v {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink-900);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.pi-summary .item.hero .v { color: var(--primary); font-size: 28px; }
.pi-summary .item.hero .l { color: var(--primary); font-weight: 600; }
.pi-summary .item.mod .v { color: var(--ok); font-size: 28px; }
.pi-summary .item.mod .l { color: var(--ok); font-weight: 600; }

.pi-graph {
  display: flex; align-items: end;
  gap: 8px;
  height: 60px;
  margin-top: 14px;
  padding: 0 10px;
}
.pi-graph .col {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
}
.pi-graph .bar-v {
  width: 100%;
  background: linear-gradient(180deg, var(--primary), #60A5FA);
  border-radius: 3px 3px 0 0;
  transition: height 0.3s;
  min-height: 3px;
}
.pi-graph .col .l { font-size: 10px; color: var(--ink-500); }

/* Legacy PI block */
.pi-block {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}

/* Focus Teeth block */
.focus-teeth-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.tooth-picker {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 4px;
  padding: 12px;
  background: var(--surface-50);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.tooth-block {
  padding: 6px 4px;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  background: #fff;
  text-align: center;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  color: var(--ink-600);
}
.tooth-block:hover { border-color: var(--primary); }
.tooth-block.selected {
  background: var(--primary); color: #fff;
  border-color: var(--primary); font-weight: 700;
}
.tooth-block.disabled {
  background: #F1F5F9; color: var(--ink-300);
  text-decoration: line-through; cursor: not-allowed;
}

/* Oleary index big number */
.oleary-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}
.oleary-item {
  background: var(--surface-50);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  text-align: center;
}
.oleary-item .l { font-size: 11px; color: var(--ink-500); margin-bottom: 6px; }
.oleary-item .v { font-size: 22px; font-weight: 700; color: var(--ink-900); font-variant-numeric: tabular-nums; }
.oleary-item.hero { background: var(--primary-50); border-color: var(--primary-100); }
.oleary-item.hero .v { color: var(--primary); font-size: 30px; }
.oleary-item.hero .l { color: var(--primary); font-weight: 600; }

/* ============ Round tabs (visits) ============ */
.tabs {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface-100);
  border-radius: 10px;
}
.tab {
  padding: 7px 18px;
  border-radius: 7px;
  background: transparent;
  border: none;
  color: var(--ink-600);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}
.tab.active {
  background: var(--primary);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(42, 111, 219, 0.3);
}

/* ============ Rich text toolbar ============ */
.rich-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding: 8px 10px;
  background: var(--surface-50);
  border: 1px solid var(--border);
  border-radius: 10px 10px 0 0;
  border-bottom: none;
}
.rich-toolbar .grp { display: flex; gap: 2px; }
.rich-toolbar .sep {
  width: 1px; height: 20px; background: var(--border);
  margin: 0 6px;
}
.rt-btn {
  min-width: 28px; height: 28px;
  border-radius: 6px;
  background: transparent; border: none;
  color: var(--ink-600);
  font-size: 12.5px;
  padding: 0 8px;
  cursor: pointer;
  display: inline-grid; place-items: center;
}
.rt-btn:hover { background: var(--surface-100); color: var(--ink-900); }
.rt-btn.b { font-weight: 800; }
.rt-btn.i { font-style: italic; }
.rt-btn.u { text-decoration: underline; }
.rt-color, .rt-hl {
  width: 22px; height: 22px;
  border-radius: 5px;
  border: 1px solid rgba(0,0,0,0.06);
  cursor: pointer;
}
.rt-editor {
  min-height: 220px;
  padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 0 0 10px 10px;
  background: var(--surface);
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink-900);
}
.rt-editor h3 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: var(--ink-900); }
.rt-editor h4 { margin: 12px 0 6px; font-size: 14px; font-weight: 600; color: var(--ink-700); }
.rt-editor p { margin: 6px 0; }
.rt-editor mark.hl-y { background: #FEF3C7; padding: 1px 2px; }
.rt-editor mark.hl-g { background: #D1FAE5; padding: 1px 2px; }
.rt-editor mark.hl-b { background: #DBEAFE; padding: 1px 2px; }
.rt-editor mark.hl-p { background: #FCE7F3; padding: 1px 2px; }

/* ============ Plan Table (Section 5) ============ */
.plan-table {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.plan-section {
  background: var(--surface);
}
.plan-section + .plan-section {
  border-top: 8px solid var(--surface-100);
}
.plan-section-title {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: var(--primary-50);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
}
.plan-section-title .idx {
  font-size: 16px;
  font-weight: 900;
}
.plan-section-title em {
  font-style: normal;
  color: var(--ink-500);
  font-weight: 500;
  font-size: 12px;
  margin-left: 4px;
}

.plan-row {
  display: grid;
  grid-template-columns: 96px 1.2fr 1fr;
  border-bottom: 1px solid var(--border);
  min-height: 100px;
}
.plan-row:last-child { border-bottom: none; }
.plan-row .plan-cat {
  padding: 16px 14px;
  background: var(--surface-50);
  border-right: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-900);
  display: flex; align-items: flex-start;
}
.plan-row .plan-items {
  padding: 14px;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  gap: 12px;
}
.plan-item {
  display: flex; flex-direction: column;
  gap: 0;
}
.plan-check {
  display: inline-flex; align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-900);
  font-weight: 500;
}
.plan-details {
  padding: 14px;
  background: #FBFCFE;
  display: flex; flex-direction: column; gap: 6px;
}
.plan-details-label {
  font-size: 11px;
  color: var(--ink-500);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ============ Goal item card (plan) ============ */
.goal-item {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  background: var(--surface);
  position: relative;
}
.goal-item + .goal-item { margin-top: 12px; }
.goal-item .g-num {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-50);
  padding: 3px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
  letter-spacing: 0.04em;
}
.goal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
.goal-grid .full { grid-column: 1 / -1; }
.goal-item .tooth-tags {
  display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px;
}
.tooth-tag {
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--surface-100);
  color: var(--ink-700);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.goal-item .g-del {
  position: absolute; top: 14px; right: 14px;
  border: none; background: transparent;
  color: var(--ink-400); cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
  font-size: 12px;
}
.goal-item .g-del:hover { background: var(--danger-50); color: var(--danger); }

/* ============ Met / Partial / Unmet toggle ============ */
.mpu {
  display: inline-flex;
  gap: 6px;
}
.mpu-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: #fff;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-500);
  cursor: pointer;
}
.mpu-btn.active.met      { background: var(--ok);     border-color: var(--ok);     color: #fff; }
.mpu-btn.active.partial  { background: var(--warn);   border-color: var(--warn);   color: #fff; }
.mpu-btn.active.unmet    { background: var(--danger); border-color: var(--danger); color: #fff; }

/* ============ Professor Panel (read-only) ============ */
.prof-panel {
  margin-top: 24px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 18px 20px;
  background: #FAFBFD;
}
.prof-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.prof-head .badge { white-space: nowrap; }
.prof-head .t { white-space: nowrap; }
.prof-head .badge {
  font-size: 10.5px;
  font-weight: 700;
  color: #4338CA;
  background: var(--info-50);
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.04em;
}
.prof-head .t { font-size: 13px; font-weight: 700; color: var(--ink-900); }
.prof-body {
  font-size: 13px;
  color: var(--ink-700);
  line-height: 1.65;
  padding: 4px 0 14px;
}
.prof-signature {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.prof-signature .meta { font-size: 11.5px; color: var(--ink-500); }
.prof-signature .meta b { color: var(--ink-900); font-weight: 600; }
.sig-image {
  height: 44px;
  padding: 4px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  display: inline-grid; place-items: center;
  font-family: 'Homemade Apple', 'Snell Roundhand', cursive;
  font-size: 20px;
  color: var(--ink-900);
}

/* ============ Photo Modal ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
  z-index: 100;
  padding: 40px;
}
.modal {
  background: var(--surface);
  border-radius: 16px;
  width: 100%;
  max-width: 1100px;
  max-height: 88vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
}
.modal-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
}
.modal-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
.modal-head .close {
  margin-left: auto;
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #fff; color: var(--ink-500);
  cursor: pointer;
}
.modal-body {
  padding: 24px;
  overflow-y: auto;
}
.photo-set-card {
  border-radius: 14px;
  padding: 20px;
  color: #fff;
  position: relative;
}
.photo-set-card.g1 { background: linear-gradient(135deg, #2A6FDB, #6366F1); }
.photo-set-card.g2 { background: linear-gradient(135deg, #10B981, #059669); }
.photo-set-card.g3 { background: linear-gradient(135deg, #8B5CF6, #EC4899); }
.photo-set-card.g4 { background: linear-gradient(135deg, #EC4899, #F43F5E); }
.photo-set-card .st { font-size: 11.5px; opacity: 0.8; letter-spacing: 0.06em; text-transform: uppercase; }
.photo-set-card .stt { font-size: 15px; font-weight: 700; margin-top: 2px; margin-bottom: 14px; }
.slot {
  background: rgba(255,255,255,0.14);
  border: 1.5px dashed rgba(255,255,255,0.4);
  border-radius: 10px;
  aspect-ratio: 4/3;
  display: grid; place-items: center;
  color: rgba(255,255,255,0.75);
  font-size: 11px;
  transition: all 0.12s;
}
.slot:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.6); }
.slot .icn { font-size: 20px; opacity: 0.8; margin-bottom: 4px; }

.slot-5 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
}
.slot-5 > .slot:nth-child(1) { grid-column: 2; grid-row: 1; }
.slot-5 > .slot:nth-child(2) { grid-column: 1; grid-row: 2; }
.slot-5 > .slot:nth-child(3) { grid-column: 2; grid-row: 2; }
.slot-5 > .slot:nth-child(4) { grid-column: 3; grid-row: 2; }
.slot-5 > .slot:nth-child(5) { grid-column: 2; grid-row: 3; }

.slot-6 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 8px;
}

/* ============ System doc labels ============ */
.doc-note {
  font-size: 11.5px;
  color: var(--ink-500);
  margin-top: 6px;
  padding-left: 12px;
  border-left: 2px solid var(--border-strong);
}

/* small helpers */
.row { display: flex; align-items: center; gap: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.spacer-16 { height: 16px; }

/* Confetti hint */
.confetti-note {
  margin-top: 16px;
  padding: 14px 16px;
  background: linear-gradient(135deg, #FEF3C7, #FCE7F3);
  border-radius: 10px;
  font-size: 12.5px;
  color: #92400E;
  border: 1px solid #FDE68A;
}

/* ============ Section badge ============ */
.sec-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
}
.sec-hero .num {
  width: 52px; height: 52px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), #6366F1);
  color: #fff;
  display: grid; place-items: center;
  font-size: 20px; font-weight: 800;
  letter-spacing: -0.02em;
}
.sec-hero .name-ko { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.sec-hero .name-en { font-size: 12px; color: var(--ink-400); font-style: italic; margin-top: 2px; }
.sec-hero .meta {
  margin-left: auto; display: flex; gap: 10px; align-items: center;
  flex-shrink: 0;
}
.sec-hero .meta > span { white-space: nowrap; }

/* scrollbar */
.nav-scroll::-webkit-scrollbar,
.main::-webkit-scrollbar { width: 6px; }
.nav-scroll::-webkit-scrollbar-thumb,
.main::-webkit-scrollbar-thumb { background: var(--ink-300); border-radius: 3px; }
.nav-scroll::-webkit-scrollbar-track,
.main::-webkit-scrollbar-track { background: transparent; }

/* ============ Sticky Section Header ============ */
.sec-sticky {
  position: sticky;
  top: 0;
  z-index: 15;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px 12px;
  margin: -8px 0 22px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
}
.sec-sticky .ss-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.sec-sticky .ss-num {
  width: 46px; height: 46px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #6366F1);
  color: #fff;
  display: grid; place-items: center;
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.sec-sticky .ss-title { min-width: 0; }
.sec-sticky .ss-ko {
  font-size: 18px; font-weight: 700; margin: 0;
  letter-spacing: -0.01em;
  color: var(--ink-900);
}
.sec-sticky .ss-en {
  font-size: 11.5px;
  color: var(--ink-400);
  font-style: italic;
  margin-top: 2px;
}
.sec-sticky .ss-review {
  display: inline-flex;
  gap: 4px;
  padding: 3px;
  background: var(--surface-100);
  border-radius: 8px;
  margin-left: auto;
  flex-shrink: 0;
}
.ss-review-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--ink-600);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}
.ss-review-btn:hover { background: rgba(255, 255, 255, 0.6); }
.ss-review-btn.active { color: #fff; font-weight: 600; }
.ss-review-btn.empty.active     { background: var(--ink-500); }
.ss-review-btn.wip.active       { background: var(--warn); }
.ss-review-btn.requested.active { background: var(--info); }
.ss-review-btn.done.active      { background: var(--ok); }

.sec-sticky .ss-progress {
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  min-width: 100px;
  flex-shrink: 0;
}
.sec-sticky .ss-pct {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink-500);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.sec-sticky .ss-pct small { font-size: 11px; font-weight: 500; color: var(--ink-400); }
.sec-sticky .ss-bar {
  width: 100px;
  height: 4px;
  background: var(--surface-100);
  border-radius: 999px;
  overflow: hidden;
}
.sec-sticky .ss-bar > span {
  display: block; height: 100%;
  background: var(--ink-400);
  border-radius: 999px;
}

/* Sub-section quick-jump chips */
.sec-sticky .ss-subs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.sec-sticky .ss-subs-l {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-400);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 4px;
}
.ss-sub-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-600);
  font-size: 11.5px;
  cursor: pointer;
  transition: all 0.12s;
}
.ss-sub-chip:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-50);
}
.ss-sub-chip .ss-sub-idx {
  display: inline-grid;
  place-items: center;
  min-width: 30px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--surface-100);
  color: var(--ink-500);
  font-weight: 700;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.ss-sub-chip:hover .ss-sub-idx {
  background: var(--primary);
  color: #fff;
}
.sec-sticky .ss-hint {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--ink-500);
}

/* ============ Combined Chart v2 — 10-row perio layout ============ */
.combined-chart-v2 {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 14px;
  overflow-x: auto;
}
.combi-grid {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 8px;
}
.combi-row-labels {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 2px;
  padding-top: 4px;
}
.combi-row-labels .row-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-500);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  height: 22px;
}
.combi-row-labels .row-label.big {
  font-size: 12px;
  color: var(--ink-900);
  font-weight: 700;
  height: 44px;
  letter-spacing: 0;
  text-transform: none;
}

.combi-cols {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  gap: 3px;
  min-width: 800px;
}
.combi-col-new {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  min-width: 0;
}

.strip-pd-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  height: 22px;
}
.pd-cell {
  position: relative;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 3px;
  display: grid;
  place-items: center;
  cursor: pointer;
  min-height: 20px;
  transition: background 0.12s;
}
.pd-cell:hover { background: var(--surface-50); border-color: var(--ink-300); }
.pd-cell .pd-empty { color: var(--ink-300); font-size: 10px; }
.pd-cell .pd-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-700);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.pd-cell .pd-num.warn { color: #DC2626; }

.pd-pop {
  position: absolute;
  z-index: 30;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  box-shadow: 0 8px 24px rgba(15,23,42,0.15);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  min-width: 140px;
}
.pd-opt {
  padding: 6px 4px;
  border: none;
  background: var(--surface-50);
  border-radius: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-700);
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: all 0.1s;
}
.pd-opt:hover { background: var(--primary-50); color: var(--primary); }
.pd-opt.warn { color: #DC2626; }
.pd-opt.active { background: var(--primary); color: #fff; }
.pd-opt.clear { background: var(--danger-50); color: var(--danger); }

.bop-cell {
  background: #FBFBFC;
  border: 1px solid var(--border);
  border-radius: 3px;
  display: grid;
  place-items: center;
  cursor: pointer;
  min-height: 20px;
  height: 22px;
  transition: background 0.12s;
}
.bop-cell:hover { background: #FEF2F2; border-color: #FDA4AF; }
.bop-red-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #DC2626;
  display: inline-block;
}
.bop-red-dot.inline { width: 6px; height: 6px; }

.mobsw-cell {
  position: relative;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 3px;
  display: grid;
  place-items: center;
  cursor: pointer;
  min-height: 20px;
  height: 22px;
  transition: background 0.12s;
}
.mobsw-cell:hover { background: var(--surface-50); border-color: var(--ink-300); }
.mobsw-cell .mobsw-empty { color: var(--ink-300); font-size: 10px; }
.mobsw-badge {
  font-size: 9.5px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.mobsw-badge.m { background: #FEE2E2; color: #B91C1C; }
.mobsw-badge.s { background: #FEF3C7; color: #92400E; }
.mobsw-pop {
  position: absolute;
  z-index: 30;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px;
  box-shadow: 0 8px 24px rgba(15,23,42,0.15);
  display: flex;
  gap: 3px;
  min-width: 180px;
}
.mobsw-opt {
  padding: 5px 8px;
  border: none;
  background: var(--surface-50);
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 700;
  cursor: pointer;
  flex: 1;
  transition: all 0.1s;
}
.mobsw-opt.m { color: #B91C1C; }
.mobsw-opt.s { color: #92400E; }
.mobsw-opt.active.m { background: #FEE2E2; }
.mobsw-opt.active.s { background: #FEF3C7; }
.mobsw-opt.clear { background: var(--danger-50); color: var(--danger); flex: 0.4; }

.tooth-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 2px 0;
  min-height: 44px;
}
.tooth-slot .tooth-body {
  position: relative;
  width: 100%;
  aspect-ratio: 40/44;
  max-width: 36px;
}
.tooth-num-upper, .tooth-num-lower {
  font-size: 10px;
  color: var(--ink-500);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

/* ============ PI red dot updates ============ */
.pi-x .quad-hit {
  fill: transparent;
  cursor: pointer;
}
.pi-x .quad-hit:hover {
  fill: rgba(220, 38, 38, 0.08);
}
.pi-red-dot {
  fill: #DC2626;
  pointer-events: none;
}

/* ============ O'Leary Trend — line chart ============ */
.trend-wrap {
  width: 100%;
  height: 260px;
  margin-top: 4px;
}
.trend-svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}
.trend-grid {
  stroke: var(--border);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}
.trend-ylabel, .trend-xlabel, .trend-xdate {
  font-size: 10.5px;
  fill: var(--ink-500);
  font-family: inherit;
}
.trend-ylabel { text-anchor: end; }
.trend-xlabel { font-weight: 600; fill: var(--ink-700); font-size: 11px; }
.trend-xdate { fill: var(--ink-400); font-size: 10px; }
.trend-target {
  stroke: var(--ok);
  stroke-width: 1.5;
  stroke-dasharray: 5 3;
}
.trend-target-label {
  font-size: 10.5px;
  fill: var(--ok);
  font-weight: 700;
  font-family: inherit;
}
.trend-area {
  fill: url(#trend-grad);
  fill: rgba(42, 111, 219, 0.10);
}
.trend-line {
  fill: none;
  stroke: var(--primary);
  stroke-width: 2.5;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.trend-line.proj {
  stroke: var(--ink-400);
  stroke-dasharray: 4 4;
  stroke-width: 2;
}
.trend-dot.actual {
  fill: #fff;
  stroke: var(--primary);
  stroke-width: 2.5;
}
.trend-dot.planned {
  fill: #fff;
  stroke: var(--ink-400);
  stroke-width: 2;
  stroke-dasharray: 2 2;
}
.trend-value {
  font-size: 11px;
  font-weight: 700;
  fill: var(--primary);
  font-variant-numeric: tabular-nums;
  font-family: inherit;
}
.trend-value.planned { fill: var(--ink-500); }

.trend-legend {
  display: flex;
  gap: 16px;
  justify-content: flex-end;
  padding: 10px 4px 0;
  font-size: 11px;
  color: var(--ink-500);
}
.trend-legend .tl-swatch {
  display: inline-block;
  width: 22px;
  height: 3px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 5px;
}
.trend-legend .tl-swatch.actual { background: var(--primary); }
.trend-legend .tl-swatch.planned { background: transparent; border-top: 2.5px dashed var(--ink-400); height: 0; }
.trend-legend .tl-swatch.target  { background: transparent; border-top: 2px dashed var(--ok); height: 0; }

.trend-delta {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.trend-delta.good { background: var(--ok-50); color: #047857; }
.trend-delta.bad  { background: var(--danger-50); color: var(--danger); }
.trend-delta .trend-delta-sub {
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-500);
}

/* ============ Etc input (Section 1 "기타") ============ */
.etc-input {
  margin-top: 10px;
  animation: etcSlide 0.25s ease-out;
}
@keyframes etcSlide {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ============ Professor inquiry textarea (Section 2 bottom) ============ */
.textarea.prof-inquiry {
  background: linear-gradient(180deg, #FFF9E6, #FFFDF5);
  border-color: #FDE68A;
  font-size: 13px;
}
.textarea.prof-inquiry:focus {
  border-color: var(--warn);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.14);
}

/* ============ Confetti Overlay (Section 8 all-Met) ============ */
.confetti-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 200;
}
.confetti-message {
  position: absolute;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 22px;
  background: #fff;
  border: 1px solid var(--ok);
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  color: #047857;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
  animation: msgPop 0.5s ease-out;
  white-space: nowrap;
}
@keyframes msgPop {
  from { opacity: 0; transform: translate(-50%, -20px) scale(0.9); }
  to   { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
.confetti-piece {
  position: absolute;
  top: -20px;
  display: inline-block;
  animation: confettiFall linear forwards;
}
.confetti-piece.circle { border-radius: 50%; }
.confetti-piece.square { border-radius: 2px; }
@keyframes confettiFall {
  0%   { transform: translate(0, -20px) rotate(0deg); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translate(var(--drift, 0), 105vh) rotate(var(--rot, 720deg)); opacity: 0; }
}

/* Sidebar nav-item spacing fix now that sign-dot is 10px */
.nav-item { gap: 8px; }
.nav-item .sign-dot { margin-right: 2px; }


/* Additional styles for features added in chart.html */
body { font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; }

/* Btn styles referenced in JSX */

  padding: 8px 14px; border-radius: 8px;

}
.btn:hover { background: var(--surface-100); }

.btn.primary:hover { background: var(--primary-600); }
.btn.photo { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
.btn.photo:hover { background: #059669; }
.btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 6px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

/* Card styles */
.card {

/* Progress bar helper */

.progress-bar > span {

/* Combi-row-labels height fix */

<!-- 2. shared.jsx: PatientPanel, SectionStickyHeader, SubSection, etc. -->
<script type="text/babel">
/* Shared UI atoms: patient panel, professor read-only panel, radio, checkbox groups, etc. */

const PatientPanel = () => {
  const info = [
    { l: '이름',      v: '김민서', b: true },
    { l: '전화번호',   v: '010-****-8821', locked: true },
    { l: '생년월일',   v: '1997.03.14', sub: '(만 28세)' },

/* Legacy — used only on non-section pages (Components / Photo) */
const SectionHero = ({ num, ko, en, right }) => (
  <div className="sec-hero">
    <div className="num">{num}</div>
    <div>
      <h1 className="name-ko">{ko}</h1>
      <div className="name-en">{en}</div>
    </div>
    {right && <div className="meta">{right}</div>}
  </div>
);

/* NEW: Sticky section header with:
   - section number auto-derived from sidebar order
   - review status (미작성 / 작성중 / 평가요청 / 평가완료)
   - progress %
   - quick-jump chips to subsections
*/
const REVIEW_STATES = [
  { k: 'empty',     label: '미작성' },
  { k: 'wip',       label: '작성 중' },
  { k: 'requested', label: '평가 요청' },
  { k: 'done',      label: '평가 완료' },
];

const SectionStickyHeader = ({ sectionId, ko, en, progress = 0, subsections = [], defaultReviewState = 'empty', hint }) => {
  // Look up section index from sidebar SECTIONS array (data-driven, re-orderable)
  const sectionOnly = (window.SECTIONS || []).filter(s => s.id !== 'dashboard');
  const idx = sectionOnly.findIndex(s => s.id === sectionId);
  const num = idx >= 0 ? String(idx + 1).padStart(2, '0') : '00';

  // Persist review state per section
  const storageKey = `hy-step:review:${sectionId}`;
  const [review, setReview] = React.useState(() => localStorage.getItem(storageKey) || defaultReviewState);
  React.useEffect(() => { localStorage.setItem(storageKey, review); }, [review, storageKey]);

  const jump = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const scroller = document.querySelector('.main');
    if (scroller) {
      // sticky header sits ~120px tall; leave gap
      const rect = el.getBoundingClientRect();
      const top = scroller.scrollTop + rect.top - 140;
      scroller.scrollTo({ top, behavior: 'smooth' });
    }
  };

  return (
    <div className="sec-sticky">
      <div className="ss-row">
        <div className="ss-num">{num}</div>
        <div className="ss-title">
          <h1 className="ss-ko">{ko}</h1>
          <div className="ss-en">{en}</div>
        </div>
        <div className="ss-review">
          {REVIEW_STATES.map(s => (
            <button key={s.k}
              className={`ss-review-btn ${s.k} ${review === s.k ? 'active' : ''}`}
              onClick={() => setReview(s.k)}
              title={`상태를 "${s.label}"으로 변경`}
            >
              {s.label}
            </button>
          ))}
        </div>
        <div className="ss-progress">
          <div className="ss-pct">{progress}<small>%</small></div>
          <div className="ss-bar"><span style={{ width: progress + '%' }} /></div>
        </div>
      </div>
      {subsections.length > 0 && (
        <div className="ss-subs">
          <span className="ss-subs-l">소분류 바로가기</span>
          {subsections.map((s, i) => (
            <button key={s.id} className="ss-sub-chip" onClick={() => jump(s.id)}>
              <span className="ss-sub-idx">{idx + 1}-{i + 1}</span>
              <span>{s.label}</span>
            </button>
          ))}
        </div>
      )}
      {hint && <div className="ss-hint">{hint}</div>}
    </div>
  );
};

const RadioGroup = ({ options, value, onChange, name }) => (
  <div className="radio-group">
    {options.map(o => (
      <button key={o} type="button"
        className={`radio-chip ${value === o ? 'active' : ''}`}
        onClick={() => onChange && onChange(o)}
      >
        <span className="dot" />
        {o}
      </button>
    ))}
  </div>
);

const CheckGroup = ({ options, value = [], onChange }) => (
  <div className="check-group">
    {options.map(o => {
      const on = value.includes(o);
      return (
        <button key={o} type="button"
          className={`check-chip ${on ? 'active' : ''}`}
          onClick={() => {
            const next = on ? value.filter(v => v !== o) : [...value, o];
            onChange && onChange(next);
          }}
        >
          <span className="box" />
          {o}
        </button>
      );
    })}
  </div>
);

const ProfPanel = ({ content, prof = '박서연 교수', date = '2026.07.20', sig = 'S.Y. Park' }) => (
  <div className="prof-panel">
    <div className="prof-head">
      <span className="badge">교수 평가</span>
      <span className="t">Read-only · 관리자 등록 시 표시</span>
    </div>
    <div className="prof-body">
      {content || '대상자의 협조도와 문진 응답이 성실하며, 예후 관찰이 필요한 부위에 대한 기록이 명확합니다. 다음 내원 시 추가로 확인해야 할 항목을 계획에 반영해 주세요.'}
    </div>
    <div className="prof-signature">
      <div className="meta">평가자 <b>{prof}</b> · {date}</div>
      <div className="sig-image">{sig}</div>
    </div>
  </div>
);

const StatusPill = ({ status }) => {
  const map = {
    done: { label: '완료', cls: 'done' },
    wip: { label: '진행 중', cls: 'wip' },
    empty: { label: '미시작', cls: 'empty' },
    review: { label: '검토중', cls: 'review' },
  };
  const s = map[status] || map.empty;
  return <span className={`sc-status-pill ${s.cls}`}><span className={`status-dot ${s.cls}`} />{s.label}</span>;
};

/* SubSection wrapper — puts a stable id + eyebrow label on a card,
   and lets the sticky header scroll to it. */
const SubSection = ({ id, label, title, sub, children, right }) => (
  <div className="card" id={id}>

Object.assign(window, { PatientPanel, SectionHero, SectionStickyHeader, RadioGroup, CheckGroup, ProfPanel, StatusPill, SubSection, REVIEW_STATES });

<!-- 3. Config parsing + sidebar.jsx: SECTIONS array + Sidebar component -->
<script type="text/babel">

/* ========= Config Parsing (from builder URL query) ========= */
const _configRaw = new URLSearchParams(location.search).get('config');
const _config = _configRaw ? JSON.parse(decodeURIComponent(_configRaw)) : null;
const _selectedSections = _config && Array.isArray(_config.sections) ? _config.sections : null;
/* When _selectedSections is set, only those sections are shown;
   their display numbers are derived from array order automatically
   because SECTIONS array is filtered before window assignment. */

/* Sidebar — data-driven section list. Section index (1..N) is derived from array order
   so sections can be re-mixed later without hardcoded numbers.
   Sign status dots: 
     - green  = 서명 업로드 완료
     - white  = 서명 요청 전 (미업로드)
     - gray   = 서명 요청 후 · 대기 중
*/

const SECTIONS = [
  { id: 'dashboard', name: '대시보드',            en: 'Overview',                progress: 62, signStatus: null,     status: 'wip' },
  { id: 's1',        name: '초진 및 대상자 사정', en: 'Initial Interview',       progress: 100, signStatus: 'signed', status: 'done' },
  { id: 's2',        name: '임상 검사',           en: 'Clinical Examination',    progress: 85, signStatus: 'pending', status: 'wip' },
  { id: 's3',        name: '구강위생 지수',       en: 'Oral Hygiene Index',      progress: 66, signStatus: 'pending', status: 'wip' },
  { id: 's4',        name: '치위생 진단',         en: 'DH Diagnosis',            progress: 40, signStatus: 'unsent', status: 'wip' },
  { id: 's5',        name: '치위생 계획',         en: 'DH Care Plan',            progress: 20, signStatus: 'unsent', status: 'wip' },
  { id: 's6',        name: '수행 기록',           en: 'Intervention Record',     progress: 0,  signStatus: 'unsent', status: 'empty' },
  { id: 's7',        name: '치위생 평가',         en: 'DH Evaluation',           progress: 0,  signStatus: 'unsent', status: 'empty' },
  { id: 's8',        name: '추적 관리 및 권고',   en: 'Follow-up',               progress: 0,  signStatus: 'unsent', status: 'empty' },
];

const SignDot = ({ status }) => {
  // status: 'signed' (green) | 'pending' (gray) | 'unsent' (white outlined)
  const map = {
    signed:  { title: '교수 서명 업로드 완료' },
    pending: { title: '서명 요청 후 · 대기 중' },
    unsent:  { title: '서명 요청 전' },
  };
  if (!status) return <span className="sign-dot placeholder" />;
  return <span className={`sign-dot ${status}`} title={map[status]?.title} />;
};

const Sidebar = ({ current, onChange }) => {
  const SECTIONS = window.SECTIONS;
  const sectionOnly = SECTIONS.filter(s => s.id !== 'dashboard');
  const overall = Math.round(sectionOnly.reduce((a, s) => a + s.progress, 0) / sectionOnly.length);

  const handleDownload = (format) => {
    // Trigger the print flow (browser save-as-PDF for pdf; naive HTML dump for html)
    if (format === 'pdf') {
      window.print();
    } else {
      // simple html snapshot download
      const html = '<!doctype html><meta charset="utf-8"><title>Hy-STEP Chart Export</title>' + document.documentElement.outerHTML;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'hy-step-chart.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  };

  return (
    <aside className="sidebar">
      <div className="sidebar-brand">
        <img src="assets/hy-step-logo.png" alt="Hy-STEP" />
      </div>

      <div className="mini-patient">
        <div className="row1">
          <span className="name">김민서</span>
          <span className="visit">2차 내원</span>
        </div>
        <div className="meta">여성 · 만 28세</div>
        <div className="progress-mini">
          <div className="label"><span>전체 진행률</span><b>{overall}%</b></div>
          <div className="bar"><span style={{ width: overall + '%' }} /></div>
        </div>
      </div>

      <nav className="nav-scroll">
        <div className="nav-heading">Chart Sections</div>
        {SECTIONS.map((s, i) => {
          const isSection = s.id !== 'dashboard';
          // Auto-derive display index from array position (dashboard skipped)
          const idxLabel = isSection ? String(sectionOnly.findIndex(x => x.id === s.id) + 1) : '';
          return (
            <button
              key={s.id}
              className={`nav-item ${current === s.id ? 'active' : ''}`}
              onClick={() => onChange(s.id)}
              title={isSection ? `Section ${idxLabel} · 교수 서명: ${s.signStatus === 'signed' ? '완료' : s.signStatus === 'pending' ? '대기' : '요청 전'}` : ''}
            >
              {isSection ? <SignDot status={s.signStatus} /> : <span className="sign-dot placeholder" />}
              <span className="idx">{idxLabel}</span>
              <span className="name">{s.name}</span>
              <span className="pct">{s.id === 'dashboard' ? '' : `${s.progress}%`}</span>
            </button>
          );
        })}

        {/* Download buttons */}
        <div className="nav-download">
          <div className="nav-download-l">차트 파일 다운로드</div>
          <div className="nav-download-row">
            <button className="btn sm" onClick={() => handleDownload('pdf')}>
              <Icon name="save" size={12} /> PDF
            </button>
            <button className="btn sm" onClick={() => handleDownload('html')}>
              <Icon name="save" size={12} /> HTML
            </button>
